<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>明視域計算ツール</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Hiragino Kaku Gothic ProN",
            "Yu Gothic",
            Meiryo,
            sans-serif;
        background: #f3f6fa;
        color: #1f2937;
        line-height: 1.6;
    }

    .container {
        width: min(720px, 94%);
        margin: 0 auto;
        padding: 24px 0 40px;
    }

    h1 {
        margin: 0 0 22px;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #111827;
    }

    .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 18px;
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.06);
    }

    .section-title {
        margin: 0 0 18px;
        padding-bottom: 10px;
        border-bottom: 2px solid #2563eb;
        font-size: 20px;
        font-weight: 700;
        color: #1e3a8a;
    }

    .sub-title {
        margin: 22px 0 12px;
        font-size: 17px;
        font-weight: 700;
        color: #374151;
    }

    .input-group {
        margin-bottom: 17px;
    }

    .input-label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        font-size: 15px;
    }

    .input-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    input[type="number"] {
        width: 100%;
        min-height: 48px;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 17px;
        background: #fff;
    }

    input[type="number"]:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .unit {
        flex: 0 0 auto;
        font-size: 15px;
        color: #4b5563;
    }

    .sign-buttons {
        display: flex;
        gap: 7px;
        flex: 0 0 auto;
    }

    .sign-button {
        width: 48px;
        height: 48px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        background: #fff;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
    }

    .sign-button.active {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
    }

    .help-text {
        margin-top: 5px;
        font-size: 13px;
        color: #6b7280;
    }

    .choice-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
    }

    .choice-button {
        min-height: 54px;
        padding: 10px;
        border: 2px solid #d1d5db;
        border-radius: 10px;
        background: #fff;
        color: #374151;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .choice-button.active {
        border-color: #2563eb;
        background: #eff6ff;
        color: #1d4ed8;
    }

    .input-disabled {
        opacity: 0.45;
        pointer-events: none;
    }

    .result-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        margin-top: 12px;
    }

    .result-title {
        font-size: 14px;
        color: #64748b;
        margin-bottom: 3px;
    }

    .result-value {
        font-size: 26px;
        font-weight: 700;
        color: #111827;
    }

    .result-value small {
        font-size: 16px;
        font-weight: 500;
        margin-left: 3px;
    }

    .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .range-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        padding: 15px;
    }

    .range-name {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 7px;
        color: #1f2937;
    }

    .range-value {
        font-size: 20px;
        font-weight: 700;
        color: #2563eb;
    }

    .error {
        margin-top: 10px;
        color: #dc2626;
        font-size: 14px;
        font-weight: 600;
    }

    .hidden {
        display: none !important;
    }

    .auto-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        border-radius: 20px;
        background: #e0f2fe;
        color: #0369a1;
        font-size: 11px;
        font-weight: 700;
        vertical-align: middle;
    }

    .input-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        border-radius: 20px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 11px;
        font-weight: 700;
        vertical-align: middle;
    }

    @media (max-width: 560px) {
        .container {
            width: 94%;
            padding-top: 18px;
        }

        .card {
            padding: 18px;
        }

        h1 {
            font-size: 24px;
        }

        .result-grid {
            grid-template-columns: 1fr;
        }

        .choice-box {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>明視域計算ツール</h1>

    <!-- 基本 -->
    <div class="card">
        <h2 class="section-title">基本</h2>

        <div class="input-group">
            <label class="input-label" for="fullCorrection">
                完全矯正値
            </label>

            <div class="input-row">
                <div class="sign-buttons">
                    <button type="button" class="sign-button active" id="fullMinus">−</button>
                    <button type="button" class="sign-button" id="fullPlus">＋</button>
                </div>

                <input
                    type="number"
                    id="fullCorrection"
                    min="0"
                    step="0.25"
                    placeholder="例：5.00"
                >

                <span class="unit">D</span>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label" for="wearingValue">
                装用値
            </label>

            <div class="input-row">
                <div class="sign-buttons">
                    <button type="button" class="sign-button active" id="wearMinus">−</button>
                    <button type="button" class="sign-button" id="wearPlus">＋</button>
                </div>

                <input
                    type="number"
                    id="wearingValue"
                    min="0"
                    step="0.25"
                    placeholder="例：4.50"
                >

                <span class="unit">D</span>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">
                どちらから計算しますか？
            </label>

            <div class="choice-box">
                <button
                    type="button"
                    class="choice-button active"
                    id="chooseAccommodation"
                >
                    調節力から計算
                </button>

                <button
                    type="button"
                    class="choice-button"
                    id="chooseBlurDistance"
                >
                    ぼやけた距離から計算
                </button>
            </div>
        </div>

        <div class="input-group" id="accommodationGroup">
            <label class="input-label" for="accommodation">
                調節力
                <span class="input-badge">入力</span>
            </label>

            <div class="input-row">
                <input
                    type="number"
                    id="accommodation"
                    min="0"
                    step="0.25"
                    placeholder="例：2.50"
                >
                <span class="unit">D</span>
            </div>
        </div>

        <div class="input-group input-disabled" id="blurDistanceGroup">
            <label class="input-label" for="blurDistance">
                装用値でぼやけた距離
                <span class="auto-badge">自動計算</span>
            </label>

            <div class="input-row">
                <input
                    type="number"
                    id="blurDistance"
                    min="0"
                    step="1"
                    placeholder="例：30"
                    disabled
                >
                <span class="unit">cm</span>
            </div>
        </div>

        <div class="input-group hidden" id="blurInputGroup">
            <label class="input-label" for="blurDistanceInput">
                装用値でぼやけた距離
                <span class="input-badge">入力</span>
            </label>

            <div class="input-row">
                <input
                    type="number"
                    id="blurDistanceInput"
                    min="1"
                    step="1"
                    placeholder="例：30"
                >
                <span class="unit">cm</span>
            </div>
        </div>

        <div class="input-group hidden" id="accommodationAutoGroup">
            <label class="input-label" for="accommodationAuto">
                調節力
                <span class="auto-badge">自動計算</span>
            </label>

            <div class="input-row">
                <input
                    type="number"
                    id="accommodationAuto"
                    disabled
                >
                <span class="unit">D</span>
            </div>
        </div>

        <div id="basicError" class="error"></div>
    </div>


    <!-- 調節 -->
    <div class="card">
        <h2 class="section-title">調節</h2>

        <div class="result-grid">

            <div class="result-card">
                <div class="result-title">遠点</div>
                <div class="result-value" id="farPoint">—</div>
            </div>

            <div class="result-card">
                <div class="result-title">近点</div>
                <div class="result-value" id="nearPoint">—</div>
            </div>

        </div>
    </div>


    <!-- 加入 -->
    <div class="card">
        <h2 class="section-title">加入</h2>

        <div class="input-group">
            <label class="input-label" for="addition">
                加入度数
            </label>

            <div class="input-row">
                <input
                    type="number"
                    id="addition"
                    min="0"
                    step="0.25"
                    placeholder="例：1.50"
                >
                <span class="unit">D</span>
            </div>

            <div class="help-text">
                ＋度数のみ入力してください
            </div>
        </div>
    </div>


    <!-- 明視域 -->
    <div class="card hidden" id="rangeSection">
        <h2 class="section-title">明視域</h2>

        <div class="range-card">
            <div class="range-name">遠用</div>
            <div class="range-value" id="distanceRange">—</div>
        </div>

        <div class="range-card" id="middleRangeCard">
            <div class="range-name">中用</div>
            <div class="range-value" id="middleRange">—</div>
        </div>

        <div class="range-card" id="nearRangeCard">
            <div class="range-name">近用</div>
            <div class="range-value" id="nearRange">—</div>
        </div>
    </div>

</div>


<script>
    const fullCorrection = document.getElementById("fullCorrection");
    const wearingValue = document.getElementById("wearingValue");

    const accommodation = document.getElementById("accommodation");
    const accommodationAuto = document.getElementById("accommodationAuto");

    const blurDistance = document.getElementById("blurDistance");
    const blurDistanceInput = document.getElementById("blurDistanceInput");

    const addition = document.getElementById("addition");

    const accommodationGroup =
        document.getElementById("accommodationGroup");

    const blurDistanceGroup =
        document.getElementById("blurDistanceGroup");

    const blurInputGroup =
        document.getElementById("blurInputGroup");

    const accommodationAutoGroup =
        document.getElementById("accommodationAutoGroup");

    const chooseAccommodation =
        document.getElementById("chooseAccommodation");

    const chooseBlurDistance =
        document.getElementById("chooseBlurDistance");

    const basicError =
        document.getElementById("basicError");

    const rangeSection =
        document.getElementById("rangeSection");

    const middleRangeCard =
        document.getElementById("middleRangeCard");

    const nearRangeCard =
        document.getElementById("nearRangeCard");


    let calculationMode = "accommodation";


    function setSign(minusButton, plusButton, sign) {
        if (sign === "minus") {
            minusButton.classList.add("active");
            plusButton.classList.remove("active");
        } else {
            minusButton.classList.remove("active");
            plusButton.classList.add("active");
        }
    }


    function getSignedValue(input, minusButton, plusButton) {
        const value = parseFloat(input.value);

        if (isNaN(value)) {
            return null;
        }

        return plusButton.classList.contains("active")
            ? Math.abs(value)
            : -Math.abs(value);
    }


    const fullMinus = document.getElementById("fullMinus");
    const fullPlus = document.getElementById("fullPlus");

    const wearMinus = document.getElementById("wearMinus");
    const wearPlus = document.getElementById("wearPlus");


    fullMinus.addEventListener("click", () =>
        setSign(fullMinus, fullPlus, "minus")
    );

    fullPlus.addEventListener("click", () =>
        setSign(fullMinus, fullPlus, "plus")
    );

    wearMinus.addEventListener("click", () =>
        setSign(wearMinus, wearPlus, "minus")
    );

    wearPlus.addEventListener("click", () =>
        setSign(wearMinus, wearPlus, "plus")
    );


    chooseAccommodation.addEventListener("click", () => {
        calculationMode = "accommodation";

        chooseAccommodation.classList.add("active");
        chooseBlurDistance.classList.remove("active");

        accommodationGroup.classList.remove("hidden");
        blurInputGroup.classList.add("hidden");

        blurDistanceGroup.classList.remove("input-disabled");

        blurDistance.disabled = true;

        accommodationAutoGroup.classList.add("hidden");

        calculate();
    });


    chooseBlurDistance.addEventListener("click", () => {
        calculationMode = "blur";

        chooseAccommodation.classList.remove("active");
        chooseBlurDistance.classList.add("active");

        accommodationGroup.classList.add("hidden");
        blurInputGroup.classList.remove("hidden");

        blurDistanceGroup.classList.add("hidden");

        accommodationAutoGroup.classList.remove("hidden");

        calculate();
    });


    [
        fullCorrection,
        wearingValue,
        accommodation,
        blurDistanceInput,
        addition
    ].forEach(input => {
        input.addEventListener("input", calculate);
    });


    function formatDistance(distance) {
        if (!isFinite(distance) || distance <= 0) {
            return "無限遠方";
        }

        const rounded = Math.round(distance);

        return `${rounded}cm`;
    }


    function calculateDistanceFromPower(power) {
        if (Math.abs(power) < 0.000001) {
            return Infinity;
        }

        return 100 / Math.abs(power);
    }


    function calculate() {
        basicError.textContent = "";

        const full =
            getSignedValue(fullCorrection, fullMinus, fullPlus);

        const wearing =
            getSignedValue(wearingValue, wearMinus, wearPlus);

        const add =
            parseFloat(addition.value);

        if (full === null || wearing === null) {
            resetResults();
            return;
        }

        const residual = full - wearing;

        let accommodationValue;

        if (calculationMode === "accommodation") {

            accommodationValue = parseFloat(accommodation.value);

            if (isNaN(accommodationValue)) {
                resetResults();
                return;
            }

            accommodationValue = Math.max(0, accommodationValue);

            const nearPower =
                residual + accommodationValue;

            const farDistance =
                calculateDistanceFromPower(residual);

            const nearDistance =
                calculateDistanceFromPower(nearPower);

            blurDistance.value =
                isFinite(farDistance)
                    ? Math.round(farDistance)
                    : "";

            accommodationAuto.value =
                accommodationValue.toFixed(2);

            displayResults(
                farDistance,
                nearDistance,
                accommodationValue,
                add
            );

        } else {

            const blur =
                parseFloat(blurDistanceInput.value);

            if (isNaN(blur) || blur <= 0) {
                resetResults();
                return;
            }

            const blurPower =
                100 / blur;

            /*
             * 装用値でぼやけた距離から調節力を逆算
             */
            accommodationValue =
                Math.abs(blurPower) + Math.abs(residual);

            /*
             * 基本的な計算関係を維持するため、
             * ぼやけた距離から得られる屈折力を
             * 遠点側の基準として使用する。
             */
            const farDistance =
                calculateDistanceFromPower(residual);

            const nearPower =
                residual + accommodationValue;

            const nearDistance =
                calculateDistanceFromPower(nearPower);

            accommodationAuto.value =
                accommodationValue.toFixed(2);

            displayResults(
                farDistance,
                nearDistance,
                accommodationValue,
                add
            );
        }
    }


    function displayResults(
        farDistance,
        nearDistance,
        accommodationValue,
        add
    ) {

        document.getElementById("farPoint").textContent =
            formatDistance(farDistance);

        document.getElementById("nearPoint").textContent =
            formatDistance(nearDistance);

        /*
         * 遠用
         */
        document.getElementById("distanceRange").textContent =
            `${formatDistance(farDistance)} 〜 ${formatDistance(nearDistance)}`;


        /*
         * 加入度数が入力されていない場合、
         * 中用・近用は表示しない
         */
        if (isNaN(add) || add <= 0) {
            middleRangeCard.classList.add("hidden");
            nearRangeCard.classList.add("hidden");

            rangeSection.classList.remove("hidden");
            return;
        }

        middleRangeCard.classList.remove("hidden");
        nearRangeCard.classList.remove("hidden");


        /*
         * 中用部
         *
         * 遠用の屈折力に加入度数の半分を加える
         */
        const middlePower =
            (parseFloat(
                getSignedValue(
                    fullCorrection,
                    fullMinus,
                    fullPlus
                )
            ) -
            parseFloat(
                getSignedValue(
                    wearingValue,
                    wearMinus,
                    wearPlus
                )
            )) + add / 2;


        /*
         * 近用部
         *
         * 遠用の屈折力に加入度数を加える
         */
        const nearPower =
            (parseFloat(
                getSignedValue(
                    fullCorrection,
                    fullMinus,
                    fullPlus
                )
            ) -
            parseFloat(
                getSignedValue(
                    wearingValue,
                    wearMinus,
                    wearPlus
                )
            )) + add;


        const middleDistance =
            calculateDistanceFromPower(middlePower);

        const nearDistance =
            calculateDistanceFromPower(nearPower);


        document.getElementById("middleRange").textContent =
            `${formatDistance(middleDistance)} 〜 ${formatDistance(nearDistance)}`;

        document.getElementById("nearRange").textContent =
            `${formatDistance(nearDistance)} 〜 ${formatDistance(nearDistance)}`;

        rangeSection.classList.remove("hidden");
    }


    function resetResults() {

        document.getElementById("farPoint").textContent = "—";
        document.getElementById("nearPoint").textContent = "—";
        document.getElementById("distanceRange").textContent = "—";
        document.getElementById("middleRange").textContent = "—";
        document.getElementById("nearRange").textContent = "—";

        accommodationAuto.value = "";

        rangeSection.classList.add("hidden");

        middleRangeCard.classList.remove("hidden");
        nearRangeCard.classList.remove("hidden");
    }


    /*
     * 初期表示
     */
    setSign(fullMinus, fullPlus, "minus");
    setSign(wearMinus, wearPlus, "minus");

</script>

</body>
</html>
