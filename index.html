<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>明視域計算ツール</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #1f2937;
  --sub: #6b7280;
  --border: #d1d5db;
  --main: #111827;
  --error: #dc2626;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 14px 40px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.header p {
  margin: 7px 0 0;
  color: var(--sub);
  font-size: 13px;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.06);
}

.section-title {
  margin: 0 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 17px;
  font-weight: 800;
}

.field {
  margin-bottom: 20px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.field-label strong {
  font-size: 16px;
}

.optional {
  color: var(--sub);
  font-size: 12px;
  font-weight: 400;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sign-buttons {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.sign-button {
  width: 50px;
  height: 50px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: #374151;
  font-size: 21px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.sign-button.selected {
  background: var(--main);
  border-color: var(--main);
  color: #fff;
}

.sign-button:active {
  transform: scale(0.97);
}

.input-row input {
  flex: 1;
  min-width: 0;
  height: 50px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: var(--text);
  font-size: 19px;
  text-align: right;
  outline: none;
}

.input-row input:focus {
  border-color: #6b7280;
  box-shadow: 0 0 0 2px rgba(107,114,128,0.12);
}

.unit {
  width: 28px;
  font-size: 16px;
  font-weight: 700;
}

.fixed-plus {
  width: 50px;
  text-align: center;
  font-size: 21px;
  font-weight: 800;
}

.helper {
  margin-top: 6px;
  color: var(--sub);
  font-size: 12px;
  line-height: 1.5;
}

.error {
  min-height: 18px;
  margin-top: 5px;
  color: var(--error);
  font-size: 13px;
  line-height: 1.4;
}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.action-button {
  flex: 1;
  height: 54px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.calculate {
  border: none;
  background: var(--main);
  color: #fff;
}

.calculate:active {
  transform: scale(0.98);
}

.reset {
  border: 1px solid var(--border);
  background: #fff;
  color: #374151;
}

.result-card {
  display: none;
}

.result-title {
  margin: 0 0 14px;
  font-size: 19px;
  font-weight: 800;
}

.result-note {
  margin: -7px 0 14px;
  color: var(--sub);
  font-size: 12px;
}

.result-grid {
  display: grid;
  gap: 10px;
}

.result-item {
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.result-item-name {
  margin-bottom: 5px;
  font-size: 15px;
  font-weight: 800;
}

.result-range {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.result-range .unit-text {
  font-size: 17px;
  font-weight: 700;
}

.infinity {
  font-size: 22px;
}

@media (max-width: 380px) {

  .app {
    padding: 12px 10px 30px;
  }

  .card {
    padding: 16px;
    border-radius: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .sign-button {
    width: 45px;
  }

  .fixed-plus {
    width: 45px;
  }

  .result-range {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>明視域計算ツール</h1>
    <p>眼鏡店スタッフ向け</p>
  </div>


  <!-- 入力 -->

  <div class="card">

    <div class="section-title">
      基本情報
    </div>


    <!-- 完全矯正値 -->

    <div class="field">

      <div class="field-label">
        <strong>完全矯正値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="fullMinus"
            aria-label="完全矯正値 マイナス"
          >−</button>

          <button
            type="button"
            class="sign-button"
            id="fullPlus"
            aria-label="完全矯正値 プラス"
          >＋</button>

        </div>

        <input
          id="full"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：500"
          aria-label="完全矯正値"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        0.25D刻み　例：500 → 5.00D
      </div>

      <div
        id="fullError"
        class="error"
      ></div>

    </div>


    <!-- 装用値 -->

    <div class="field">

      <div class="field-label">
        <strong>装用値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="wearMinus"
            aria-label="装用値 マイナス"
          >−</button>

          <button
            type="button"
            class="sign-button"
            id="wearPlus"
            aria-label="装用値 プラス"
          >＋</button>

        </div>

        <input
          id="wear"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：450"
          aria-label="装用値"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        0.25D刻み　例：450 → 4.50D
      </div>

      <div
        id="wearError"
        class="error"
      ></div>

    </div>


    <div class="section-title" style="margin-top:28px;">
      調節・加入
    </div>


    <!-- ぼやけた距離 -->

    <div class="field">

      <div class="field-label">
        <strong>ぼやけた距離</strong>
        <span class="optional">任意</span>
      </div>

      <div class="input-row">

        <input
          id="blur"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="例：30"
          aria-label="ぼやけた距離"
        >

        <span class="unit">cm</span>

      </div>

      <div class="helper">
        入力すると調節力を算出します。未入力なら遠点のみ表示します。
      </div>

      <div
        id="blurError"
        class="error"
      ></div>

    </div>


    <!-- 加入度数 -->

    <div class="field">

      <div class="field-label">
        <strong>加入度数</strong>
        <span class="optional">任意</span>
      </div>

      <div class="input-row">

        <span class="fixed-plus">＋</span>

        <input
          id="add"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：200"
          aria-label="加入度数"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        加入度数あり：遠用・中用・近用を表示します。
      </div>

      <div
        id="addError"
        class="error"
      ></div>

    </div>


    <!-- ボタン -->

    <div class="button-row">

      <button
        type="button"
        class="action-button calculate"
        id="calculate"
      >
        計算する
      </button>

      <button
        type="button"
        class="action-button reset"
        id="reset"
      >
        リセット
      </button>

    </div>

  </div>


  <!-- 結果 -->

  <div
    id="result"
    class="card result-card"
  ></div>

</div>


<script>

/* =====================================
   入力欄
===================================== */

const fullInput =
  document.getElementById("full");

const wearInput =
  document.getElementById("wear");

const blurInput =
  document.getElementById("blur");

const addInput =
  document.getElementById("add");

const resultBox =
  document.getElementById("result");


/* =====================================
   符号
===================================== */

let fullSign = "-";
let wearSign = "-";


/* =====================================
   全角 → 半角
===================================== */

function toHalfWidth(value) {

  return value
    .replace(/[０-９．]/g, function(s) {

      return String.fromCharCode(
        s.charCodeAt(0) - 0xFEE0
      );

    })
    .replace(/＋/g, "+")
    .replace(/−/g, "-");

}


/* =====================================
   度数入力の整形
===================================== */

function normalizeDegreeInput(input) {

  let value =
    input.value.trim();

  value =
    toHalfWidth(value);

  value =
    value.replace(
      /[^0-9.]/g,
      ""
    );

  const parts =
    value.split(".");

  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts.slice(1).join("");

  }

  if (value === "") {

    input.value = "";

    return;

  }

  const number =
    Number(value);

  if (!Number.isFinite(number)) {

    return;

  }

  /*
    500 → 5.00
    450 → 4.50
    425 → 4.25
    200 → 2.00
  */

  if (
    Number.isInteger(number) &&
    number >= 25
  ) {

    input.value =
      (number / 100).toFixed(2);

    return;

  }

  /*
    5 → 5.00
    4.5 → 4.50
    4.25 → 4.25
  */

  input.value =
    number.toFixed(2);

}


/* =====================================
   距離入力の整形
===================================== */

function normalizeBlurInput() {

  let value =
    blurInput.value.trim();

  value =
    toHalfWidth(value);

  value =
    value.replace(
      /[^0-9]/g,
      ""
    );

  blurInput.value =
    value;

}


/* =====================================
   入力欄から離れた時
===================================== */

[
  fullInput,
  wearInput,
  addInput
].forEach(function(input) {

  input.addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(this);

    }
  );

});


blurInput.addEventListener(
  "blur",
  function() {

    normalizeBlurInput();

  }
);


/* =====================================
   符号ボタン
===================================== */

function setupSignButtons(
  minusId,
  plusId,
  callback
) {

  const minus =
    document.getElementById(minusId);

  const plus =
    document.getElementById(plusId);


  minus.addEventListener(
    "click",
    function() {

      minus.classList.add("selected");

      plus.classList.remove("selected");

      callback("-");

    }
  );


  plus.addEventListener(
    "click",
    function() {

      plus.classList.add("selected");

      minus.classList.remove("selected");

      callback("+");

    }
  );

}


setupSignButtons(
  "fullMinus",
  "fullPlus",
  function(sign) {

    fullSign = sign;

  }
);


setupSignButtons(
  "wearMinus",
  "wearPlus",
  function(sign) {

    wearSign = sign;

  }
);


/* =====================================
   エラー
===================================== */

function error(id, message) {

  document.getElementById(id).textContent =
    message;

}


/* =====================================
   度数チェック
===================================== */

function validateDegree(
  input,
  errorId,
  label
) {

  const raw =
    input.value.trim();


  if (raw === "") {

    error(
      errorId,
      label + "を入力してください。"
    );

    return false;

  }


  const value =
    Number(raw);


  if (!Number.isFinite(value)) {

    error(
      errorId,
      "正しい度数を入力してください。"
    );

    return false;

  }


  /*
    0.25D刻み
  */

  const remainder =
    Math.round(value * 100) % 25;


  if (remainder !== 0) {

    error(
      errorId,
      "0.25D刻みで入力してください。"
    );

    return false;

  }


  /*
    0.00〜20.00D
  */

  if (
    value < 0 ||
    value > 20
  ) {

    error(
      errorId,
      "0.00〜20.00Dの範囲で入力してください。"
    );

    return false;

  }


  error(
    errorId,
    ""
  );


  return true;

}


/* =====================================
   距離計算
===================================== */

function distance(power) {

  /*
    目の要素が0以下
    → 無限遠方
  */

  if (power <= 0) {

    return Infinity;

  }


  return 100 / power;

}


/* =====================================
   距離表示
===================================== */

function displayDistance(value) {

  if (!Number.isFinite(value)) {

    return '<span class="infinity">無限遠方</span>';

  }


  return (
    Math.round(value) +
    '<span class="unit-text">cm</span>'
  );

}


/* =====================================
   結果カード
===================================== */

function resultRow(
  name,
  far,
  near
) {

  let text =
    displayDistance(far);


  if (near !== null) {

    text +=
      " 〜 " +
      displayDistance(near);

  }


  return `
    <div class="result-item">

      <div class="result-item-name">
        ${name}
      </div>

      <div class="result-range">
        ${text}
      </div>

    </div>
  `;

}


/* =====================================
   計算
===================================== */

document
  .getElementById("calculate")
  .addEventListener(
    "click",
    calculate
  );


function calculate() {

  /*
    全角 → 半角
  */

  normalizeDegreeInput(fullInput);

  normalizeDegreeInput(wearInput);

  normalizeDegreeInput(addInput);

  normalizeBlurInput();


  /*
    エラーを消す
  */

  error("fullError", "");

  error("wearError", "");

  error("blurError", "");

  error("addError", "");


  resultBox.style.display =
    "none";


  /*
    完全矯正値
  */

  const fullValid =
    validateDegree(
      fullInput,
      "fullError",
      "完全矯正値"
    );


  /*
    装用値
  */

  const wearValid =
    validateDegree(
      wearInput,
      "wearError",
      "装用値"
    );


  if (
    !fullValid ||
    !wearValid
  ) {

    return;

  }


  /*
    ぼやけた距離
  */

  let blurDistanceValue =
    null;


  if (
    blurInput.value.trim() !== ""
  ) {

    const value =
      Number(
        blurInput.value
      );


    if (
      !Number.isInteger(value) ||
      value < 10 ||
      value > 100
    ) {

      error(
        "blurError",
        "10〜100cmの整数で入力してください。"
      );

      return;

    }


    blurDistanceValue =
      value;

  }


  /*
    加入度数
  */

  let addition =
    null;


  if (
    addInput.value.trim() !== ""
  ) {

    const addValid =
      validateDegree(
        addInput,
        "addError",
        "加入度数"
      );


    if (!addValid) {

      return;

    }


    addition =
      Number(
        addInput.value
      );

  }


  /*
    D値
  */

  const full =
    Number(
      fullInput.value
    );


  const wear =
    Number(
      wearInput.value
    );


  const fullPower =
    fullSign === "-"
      ? -full
      : full;


  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;


  /*
    遠点屈折力

    ＝ −完全矯正値 ＋ 装用値
  */

  const farPointPower =
    -fullPower +
    wearPower;


  /*
    調節力

    ＝ 近点屈折力 − 遠点屈折力

    近点屈折力
    ＝ 100 ÷ ぼやけた距離(cm)
  */

  let accommodation =
    null;


  if (
    blurDistanceValue !== null
  ) {

    const nearPointPower =
      100 /
      blurDistanceValue;


    accommodation =
      nearPointPower -
      farPointPower;

  }


  /*
    遠用
  */

  const farDistance =
    distance(
      farPointPower
    );


  let nearDistance =
    null;


  if (
    accommodation !== null
  ) {

    nearDistance =
      distance(
        farPointPower +
        accommodation
      );

  }


  /*
    結果
  */

  let html = `

    <div class="result-title">
      計算結果
    </div>

    <div class="result-note">
      遠い距離 → 近い距離
    </div>

    <div class="result-grid">

  `;


  html +=
    resultRow(
      "遠用",
      farDistance,
      nearDistance
    );


  /*
    加入あり
  */

  if (
    addition !== null
  ) {


    /*
      中用
      ＝ 遠用部 ＋ 加入度数の1/4
    */

    const intermediatePower =
      farPointPower +
      addition / 4;


    const intermediateFar =
      distance(
        intermediatePower
      );


    let intermediateNear =
      null;


    if (
      accommodation !== null
    ) {

      intermediateNear =
        distance(
          intermediatePower +
          accommodation
        );

    }


    html +=
      resultRow(
        "中用",
        intermediateFar,
        intermediateNear
      );


    /*
      近用
      ＝ 遠用部 ＋ 加入度数
    */

    const nearPower =
      farPointPower +
      addition;


    const nearFar =
      distance(
        nearPower
      );


    let nearNear =
      null;


    if (
      accommodation !== null
    ) {

      nearNear =
        distance(
          nearPower +
          accommodation
        );

    }


    html +=
      resultRow(
        "近用",
        nearFar,
        nearNear
      );

  }


  html += `
    </div>
  `;


  /*
    表示
  */

  resultBox.innerHTML =
    html;


  resultBox.style.display =
    "block";


  /*
    結果までスクロール
  */

  setTimeout(function() {

    resultBox.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 50);

}


/* =====================================
   リセット
===================================== */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    reset
  );


function reset() {

  fullInput.value = "";

  wearInput.value = "";

  blurInput.value = "";

  addInput.value = "";


  fullSign = "-";

  wearSign = "-";


  document
    .getElementById("fullMinus")
    .classList.add("selected");

  document
    .getElementById("fullPlus")
    .classList.remove("selected");


  document
    .getElementById("wearMinus")
    .classList.add("selected");

  document
    .getElementById("wearPlus")
    .classList.remove("selected");


  error("fullError", "");

  error("wearError", "");

  error("blurError", "");

  error("addError", "");


  resultBox.innerHTML =
    "";

  resultBox.style.display =
    "none";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>

</body>
</html>
