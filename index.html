<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>明視域計算ツール</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #1f2937;
  --sub: #6b7280;
  --border: #d1d5db;
  --main: #111827;
  --error: #dc2626;
  --auto-bg: #f3f4f6;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 14px 40px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.06);
}

.section-title {
  margin: 0 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 17px;
  font-weight: 800;
}

.field {
  margin-bottom: 20px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.field-label strong {
  font-size: 16px;
}

.field-label-main {
  display: flex;
  align-items: center;
  min-width: 0;
}

.optional {
  color: var(--sub);
  font-size: 12px;
  font-weight: 400;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sign-buttons {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.sign-button {
  width: 50px;
  height: 50px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: #374151;
  font-size: 21px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.sign-button.selected {
  background: var(--main);
  border-color: var(--main);
  color: #fff;
}

.sign-button:active {
  transform: scale(0.97);
}

.input-row input {
  flex: 1;
  min-width: 0;
  height: 50px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: var(--text);
  font-size: 19px;
  text-align: right;
  outline: none;
}

.input-row input:focus {
  border-color: #6b7280;
  box-shadow: 0 0 0 2px rgba(107,114,128,0.12);
}

.input-row input.auto-input {
  background: var(--auto-bg);
  color: var(--sub);
  border-color: #e5e7eb;
  cursor: default;
}

.input-row input.auto-input:focus {
  border-color: #e5e7eb;
  box-shadow: none;
}

.unit {
  width: 30px;
  font-size: 16px;
  font-weight: 700;
}

.fixed-plus {
  width: 50px;
  text-align: center;
  font-size: 21px;
  font-weight: 800;
}

.helper {
  margin-top: 6px;
  color: var(--sub);
  font-size: 12px;
  line-height: 1.5;
}

.error {
  min-height: 18px;
  margin-top: 5px;
  color: var(--error);
  font-size: 13px;
  line-height: 1.4;
}

.calculation-choice {
  margin-bottom: 24px;
}

.choice-title {
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: 800;
}

.choice-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.choice-button {
  min-height: 58px;
  padding: 9px 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  color: #374151;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.choice-button.selected {
  background: var(--main);
  border-color: var(--main);
  color: #fff;
}

.choice-button:active {
  transform: scale(0.98);
}

.field-status {
  display: inline-flex;
  align-items: center;
  margin-left: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  vertical-align: middle;
}

.input-status {
  background: #111827;
  color: #fff;
}

.auto-status {
  background: #e5e7eb;
  color: #6b7280;
}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.action-button {
  flex: 1;
  height: 54px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.calculate {
  border: none;
  background: var(--main);
  color: #fff;
}

.calculate:active {
  transform: scale(0.98);
}

.reset {
  border: 1px solid var(--border);
  background: #fff;
  color: #374151;
}

.result-card {
  display: none;
}

.result-title {
  margin: 0 0 14px;
  font-size: 19px;
  font-weight: 800;
}

.result-note {
  margin: -7px 0 14px;
  color: var(--sub);
  font-size: 12px;
}

.adjustment-result {
  margin-bottom: 16px;
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.adjustment-title {
  margin-bottom: 10px;
  font-size: 15px;
  font-weight: 800;
}

.adjustment-values {
  display: grid;
  gap: 8px;
}

.adjustment-value {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
}

.adjustment-value strong {
  font-size: 21px;
}

.result-grid {
  display: grid;
  gap: 10px;
}

.result-item {
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.result-item-name {
  margin-bottom: 5px;
  font-size: 15px;
  font-weight: 800;
}

.result-range {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.result-range .unit-text {
  font-size: 17px;
  font-weight: 700;
}

.infinity {
  font-size: 22px;
}

@media (max-width: 380px) {

  .app {
    padding: 12px 10px 30px;
  }

  .card {
    padding: 16px;
    border-radius: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .sign-button {
    width: 45px;
  }

  .fixed-plus {
    width: 45px;
  }

  .result-range {
    font-size: 22px;
  }

  .choice-button {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>明視域計算ツール</h1>
  </div>

  <div class="card">

    <div class="section-title">
      基本情報
    </div>

    <div class="field">

      <div class="field-label">
        <strong>完全矯正値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="fullMinus"
          >−</button>

          <button
            type="button"
            class="sign-button"
            id="fullPlus"
          >＋</button>

        </div>

        <input
          id="full"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：500"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        0.25D刻み　例：500 → 5.00D
      </div>

      <div id="fullError" class="error"></div>

    </div>

    <div class="field">

      <div class="field-label">
        <strong>装用値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="wearMinus"
          >−</button>

          <button
            type="button"
            class="sign-button"
            id="wearPlus"
          >＋</button>

        </div>

        <input
          id="wear"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：450"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        0.25D刻み　例：450 → 4.50D
      </div>

      <div id="wearError" class="error"></div>

    </div>


    <div class="section-title" style="margin-top:28px;">
      調節
    </div>

    <div class="calculation-choice">

      <div class="choice-title">
        どちらから計算しますか？
      </div>

      <div class="choice-buttons">

        <button
          type="button"
          class="choice-button selected"
          id="distanceMode"
        >
          装用値でぼやけた距離<br>
          から計算
        </button>

        <button
          type="button"
          class="choice-button"
          id="accommodationMode"
        >
          調節力<br>
          から計算
        </button>

      </div>

    </div>

    <div class="field">

      <div class="field-label">

        <div class="field-label-main">

          <strong>装用値でぼやけた距離</strong>

          <span
            class="field-status input-status"
            id="blurStatus"
          >
            入力
          </span>

        </div>

        <span class="optional">任意</span>

      </div>

      <div class="input-row">

        <input
          id="blur"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：30"
        >

        <span class="unit">cm</span>

      </div>

      <div
        class="helper"
        id="blurHelper"
      >
        ぼやけ始めた距離を入力すると、調節力を自動計算します。
      </div>

      <div id="blurError" class="error"></div>

    </div>

    <div class="field">

      <div class="field-label">

        <div class="field-label-main">

          <strong>調節力</strong>

          <span
            class="field-status auto-status"
            id="accommodationStatus"
          >
            自動計算
          </span>

        </div>

        <span class="optional">任意</span>

      </div>

      <div class="input-row">

        <input
          id="accommodation"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：200"
          readonly
          class="auto-input"
        >

        <span class="unit">D</span>

      </div>

      <div
        class="helper"
        id="accommodationHelper"
      >
        装用値でぼやけた距離から自動計算します。
      </div>

      <div id="accommodationError" class="error"></div>

    </div>


    <div class="section-title" style="margin-top:28px;">
      加入
    </div>

    <div class="field">

      <div class="field-label">
        <strong>装用値加入度数</strong>
        <span class="optional">任意</span>
      </div>

      <div class="input-row">

        <span class="fixed-plus">＋</span>

        <input
          id="add"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：200"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        加入度数あり：遠用・中用・近用を表示します。
      </div>

      <div id="addError" class="error"></div>

    </div>

    <div class="button-row">

      <button
        type="button"
        class="action-button calculate"
        id="calculate"
      >
        計算する
      </button>

      <button
        type="button"
        class="action-button reset"
        id="reset"
      >
        リセット
      </button>

    </div>

  </div>

  <div
    id="result"
    class="card result-card"
  ></div>

</div>


<script>

const fullInput =
  document.getElementById("full");

const wearInput =
  document.getElementById("wear");

const blurInput =
  document.getElementById("blur");

const accommodationInput =
  document.getElementById("accommodation");

const addInput =
  document.getElementById("add");

const resultBox =
  document.getElementById("result");


let calculationMode = "distance";

let fullSign = "-";
let wearSign = "-";


function toHalfWidth(value) {

  return value
    .replace(/[０-９．]/g, function(s) {

      return String.fromCharCode(
        s.charCodeAt(0) - 0xFEE0
      );

    })
    .replace(/＋/g, "+")
    .replace(/−/g, "-");

}


function normalizeDegreeInput(input) {

  let value =
    toHalfWidth(input.value.trim());

  value =
    value.replace(/[^0-9.]/g, "");

  const parts =
    value.split(".");

  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts.slice(1).join("");

  }

  if (value === "") {

    input.value = "";

    return;

  }

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return;
  }

  if (
    Number.isInteger(number) &&
    number >= 25
  ) {

    input.value =
      (number / 100).toFixed(2);

    return;

  }

  input.value =
    number.toFixed(2);

}


function normalizeDistanceInput() {

  let value =
    toHalfWidth(
      blurInput.value.trim()
    );

  value =
    value.replace(/[^0-9]/g, "");

  blurInput.value =
    value;

}


function normalizeAccommodationInput() {

  let value =
    toHalfWidth(
      accommodationInput.value.trim()
    );

  value =
    value.replace(/[^0-9.]/g, "");

  const parts =
    value.split(".");

  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts.slice(1).join("");

  }

  if (value === "") {

    accommodationInput.value = "";

    return;

  }

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return;
  }

  if (
    Number.isInteger(number) &&
    number >= 25
  ) {

    accommodationInput.value =
      (number / 100).toFixed(2);

    return;

  }

  accommodationInput.value =
    number.toFixed(2);

}


const distanceModeButton =
  document.getElementById("distanceMode");

const accommodationModeButton =
  document.getElementById("accommodationMode");

const blurStatus =
  document.getElementById("blurStatus");

const accommodationStatus =
  document.getElementById("accommodationStatus");

const blurHelper =
  document.getElementById("blurHelper");

const accommodationHelper =
  document.getElementById("accommodationHelper");


function updateCalculationModeUI() {

  if (calculationMode === "distance") {

    distanceModeButton.classList.add("selected");
    accommodationModeButton.classList.remove("selected");

    blurStatus.textContent =
      "入力";

    blurStatus.className =
      "field-status input-status";

    accommodationStatus.textContent =
      "自動計算";

    accommodationStatus.className =
      "field-status auto-status";

    blurInput.readOnly = false;
    blurInput.classList.remove("auto-input");

    accommodationInput.readOnly = true;
    accommodationInput.classList.add("auto-input");

    blurHelper.textContent =
      "ぼやけ始めた距離を入力すると、調節力を自動計算します。";

    accommodationHelper.textContent =
      "装用値でぼやけた距離から自動計算します。";

  }
  else {

    distanceModeButton.classList.remove("selected");
    accommodationModeButton.classList.add("selected");

    blurStatus.textContent =
      "自動計算";

    blurStatus.className =
      "field-status auto-status";

    accommodationStatus.textContent =
      "入力";

    accommodationStatus.className =
      "field-status input-status";

    blurInput.readOnly = true;
    blurInput.classList.add("auto-input");

    accommodationInput.readOnly = false;
    accommodationInput.classList.remove("auto-input");

    blurHelper.textContent =
      "調節力から装用値でぼやけた距離を自動計算します。";

    accommodationHelper.textContent =
      "調節力を入力すると、装用値でぼやけた距離を自動計算します。";

  }

}


distanceModeButton.addEventListener(
  "click",
  function() {

    calculationMode = "distance";

    if (
      blurInput.value.trim() !== "" &&
      blurInput.value !== "無限遠方"
    ) {

      updateAccommodationFromDistance();

    }

    updateCalculationModeUI();

  }
);


accommodationModeButton.addEventListener(
  "click",
  function() {

    calculationMode = "accommodation";

    if (
      accommodationInput.value.trim() !== ""
    ) {

      updateDistanceFromAccommodation();

    }

    updateCalculationModeUI();

  }
);


function setupSignButtons(
  minusId,
  plusId,
  callback
) {

  const minus =
    document.getElementById(minusId);

  const plus =
    document.getElementById(plusId);


  minus.addEventListener(
    "click",
    function() {

      minus.classList.add("selected");

      plus.classList.remove("selected");

      callback("-");

    }
  );


  plus.addEventListener(
    "click",
    function() {

      plus.classList.add("selected");

      minus.classList.remove("selected");

      callback("+");

    }
  );

}


setupSignButtons(
  "fullMinus",
  "fullPlus",
  function(sign) {

    fullSign = sign;

  }
);


setupSignButtons(
  "wearMinus",
  "wearPlus",
  function(sign) {

    wearSign = sign;

  }
);


function error(id, message) {

  document.getElementById(id).textContent =
    message;

}


function getFarPointPower() {

  const full =
    Number(fullInput.value);

  const wear =
    Number(wearInput.value);

  const fullPower =
    fullSign === "-"
      ? -full
      : full;

  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;

  return -fullPower + wearPower;

}


function updateAccommodationFromDistance() {

  normalizeDistanceInput();

  if (
    blurInput.value.trim() === ""
  ) {

    accommodationInput.value = "";

    return;

  }

  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {

    return;

  }

  const distanceValue =
    Number(blurInput.value);

  if (
    !Number.isFinite(distanceValue) ||
    distanceValue <= 0
  ) {

    accommodationInput.value = "";

    return;

  }

  const farPointPower =
    getFarPointPower();

  const nearPointPower =
    100 / distanceValue;

  const accommodation =
    nearPointPower - farPointPower;

  accommodationInput.value =
    accommodation.toFixed(2);

}


function updateDistanceFromAccommodation() {

  normalizeAccommodationInput();

  if (
    accommodationInput.value.trim() === ""
  ) {

    blurInput.value = "";

    return;

  }

  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {

    return;

  }

  const accommodation =
    Number(accommodationInput.value);

  if (
    !Number.isFinite(accommodation)
  ) {

    blurInput.value = "";

    return;

  }

  const farPointPower =
    getFarPointPower();

  const nearPointPower =
    farPointPower +
    accommodation;


  if (
    nearPointPower <= 0
  ) {

    blurInput.value =
      "無限遠方";

    return;

  }


  const distance =
    100 / nearPointPower;

  blurInput.value =
    Math.round(distance);

}


blurInput.addEventListener(
  "blur",
  function() {

    if (calculationMode !== "distance") {
      return;
    }

    updateAccommodationFromDistance();

  }
);


accommodationInput.addEventListener(
  "blur",
  function() {

    if (calculationMode !== "accommodation") {
      return;
    }

    updateDistanceFromAccommodation();

  }
);


[
  fullInput,
  wearInput
].forEach(function(input) {

  input.addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(this);

      if (calculationMode === "distance") {

        if (
          blurInput.value.trim() !== "" &&
          blurInput.value !== "無限遠方"
        ) {

          updateAccommodationFromDistance();

        }

      }
      else {

        if (
          accommodationInput.value.trim() !== ""
        ) {

          updateDistanceFromAccommodation();

        }

      }

    }
  );

});


addInput.addEventListener(
  "blur",
  function() {

    normalizeDegreeInput(this);

  }
);


function distance(power) {

  if (power <= 0) {

    return Infinity;

  }

  return 100 / power;

}


function displayDistance(value) {

  if (!Number.isFinite(value)) {

    return '<span class="infinity">無限遠方</span>';

  }

  return (
    Math.round(value) +
    '<span class="unit-text">cm</span>'
  );

}


function resultRow(
  name,
  far,
  near
) {

  let text =
    displayDistance(far);

  if (near !== null) {

    text +=
      " 〜 " +
      displayDistance(near);

  }

  return `
    <div class="result-item">

      <div class="result-item-name">
        ${name}
      </div>

      <div class="result-range">
        ${text}
      </div>

    </div>
  `;

}


document
  .getElementById("calculate")
  .addEventListener(
    "click",
    calculate
  );


function calculate() {

  normalizeDegreeInput(fullInput);

  normalizeDegreeInput(wearInput);

  if (
    blurInput.value !== "無限遠方" &&
    calculationMode === "distance"
  ) {

    normalizeDistanceInput();

  }

  if (
    calculationMode === "accommodation"
  ) {

    normalizeAccommodationInput();

  }

  normalizeDegreeInput(addInput);


  error("fullError", "");
  error("wearError", "");
  error("blurError", "");
  error("accommodationError", "");
  error("addError", "");


  resultBox.style.display =
    "none";


  if (
    fullInput.value.trim() === ""
  ) {

    error(
      "fullError",
      "完全矯正値を入力してください。"
    );

    return;

  }


  if (
    wearInput.value.trim() === ""
  ) {

    error(
      "wearError",
      "装用値を入力してください。"
    );

    return;

  }


  const full =
    Number(fullInput.value);

  const wear =
    Number(wearInput.value);


  if (
    !Number.isFinite(full) ||
    !Number.isFinite(wear)
  ) {

    error(
      "fullError",
      "正しい度数を入力してください。"
    );

    return;

  }


  const fullPower =
    fullSign === "-"
      ? -full
      : full;

  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;


  const farPointPower =
    -fullPower +
    wearPower;


  let accommodation =
    null;

  let blurDistanceValue =
    null;


  if (
    calculationMode === "distance"
  ) {

    if (
      blurInput.value.trim() === ""
    ) {

      error(
        "blurError",
        "装用値でぼやけた距離を入力してください。"
      );

      return;

    }

    if (
      blurInput.value === "無限遠方"
    ) {

      error(
        "blurError",
        "正しい距離を入力してください。"
      );

      return;

    }


    blurDistanceValue =
      Number(blurInput.value);

    if (
      !Number.isFinite(blurDistanceValue) ||
      blurDistanceValue <= 0
    ) {

      error(
        "blurError",
        "正しい距離を入力してください。"
      );

      return;

    }


    const nearPointPower =
      100 / blurDistanceValue;

    accommodation =
      nearPointPower -
      farPointPower;


    accommodationInput.value =
      accommodation.toFixed(2);

  }


  else {

    if (
      accommodationInput.value.trim() === ""
    ) {

      error(
        "accommodationError",
        "調節力を入力してください。"
      );

      return;

    }


    accommodation =
      Number(
        accommodationInput.value
      );

    if (
      !Number.isFinite(accommodation)
    ) {

      error(
        "accommodationError",
        "正しい調節力を入力してください。"
      );

      return;

    }


    const nearPointPower =
      farPointPower +
      accommodation;


    if (
      nearPointPower <= 0
    ) {

      blurDistanceValue =
        Infinity;

      blurInput.value =
        "無限遠方";

    }
    else {

      blurDistanceValue =
        100 / nearPointPower;

      blurInput.value =
        Math.round(blurDistanceValue);

    }

  }


  const farDistance =
    distance(
      farPointPower
    );


  let nearDistance =
    null;


  if (
    accommodation !== null
  ) {

    nearDistance =
      distance(
        farPointPower +
        accommodation
      );

  }


  let addition =
    null;


  if (
    addInput.value.trim() !== ""
  ) {

    addition =
      Number(addInput.value);

    if (
      !Number.isFinite(addition)
    ) {

      error(
        "addError",
        "正しい加入度数を入力してください。"
      );

      return;

    }

  }


  let html = `

    <div class="result-title">
      計算結果
    </div>

  `;


  if (
    accommodation !== null ||
    blurDistanceValue !== null
  ) {

    html += `

      <div class="adjustment-result">

        <div class="adjustment-title">
          調節・ぼやけた距離
        </div>

        <div class="adjustment-values">

          <div class="adjustment-value">
            <span>調節力</span>

            <strong>
              ${
                accommodation !== null
                  ? accommodation.toFixed(2) + "D"
                  : "—"
              }
            </strong>
          </div>

          <div class="adjustment-value">

            <span>
              装用値でぼやけた距離
            </span>

            <strong>
              ${
                blurDistanceValue === Infinity
                  ? "無限遠方"
                  : blurDistanceValue !== null
                    ? Math.round(blurDistanceValue) + "cm"
                    : "—"
              }
            </strong>

          </div>

        </div>

      </div>

    `;

  }


  html += `

    <div class="result-note">
      明視域：遠い距離 → 近い距離
    </div>

    <div class="result-grid">

  `;


  html +=
    resultRow(
      "遠用",
      farDistance,
      nearDistance
    );


  if (
    addition !== null
  ) {

    const intermediatePower =
      farPointPower +
      addition / 4;

    const intermediateFar =
      distance(
        intermediatePower
      );

    let intermediateNear =
      null;

    if (
      accommodation !== null
    ) {

      intermediateNear =
        distance(
          intermediatePower +
          accommodation
        );

    }


    html +=
      resultRow(
        "中用",
        intermediateFar,
        intermediateNear
      );


    const nearPower =
      farPointPower +
      addition;

    const nearFar =
      distance(
        nearPower
      );

    let nearNear =
      null;

    if (
      accommodation !== null
    ) {

      nearNear =
        distance(
          nearPower +
          accommodation
        );

    }


    html +=
      resultRow(
        "近用",
        nearFar,
        nearNear
      );

  }


  html += `
    </div>
  `;


  resultBox.innerHTML =
    html;

  resultBox.style.display =
    "block";


  setTimeout(function() {

    resultBox.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 50);

}


document
  .getElementById("reset")
  .addEventListener(
    "click",
    reset
  );


function reset() {

  fullInput.value = "";
  wearInput.value = "";
  blurInput.value = "";
  accommodationInput.value = "";
  addInput.value = "";

  fullSign = "-";
  wearSign = "-";

  calculationMode = "distance";


  document
    .getElementById("fullMinus")
    .classList.add("selected");

  document
    .getElementById("fullPlus")
    .classList.remove("selected");


  document
    .getElementById("wearMinus")
    .classList.add("selected");

  document
    .getElementById("wearPlus")
    .classList.remove("selected");


  error("fullError", "");
  error("wearError", "");
  error("blurError", "");
  error("accommodationError", "");
  error("addError", "");


  resultBox.innerHTML = "";

  resultBox.style.display = "none";


  updateCalculationModeUI();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


updateCalculationModeUI();

</script>

</body>
</html>
