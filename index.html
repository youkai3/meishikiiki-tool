<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>明視域計算ツール</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #1f2937;
  --sub: #6b7280;
  --border: #d1d5db;
  --main: #111827;
  --error: #dc2626;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 14px 40px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.06);
}

.section-title {
  margin: 0 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 17px;
  font-weight: 800;
}

.field {
  margin-bottom: 20px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.field-label strong {
  font-size: 16px;
}

.optional {
  color: var(--sub);
  font-size: 12px;
  font-weight: 400;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sign-buttons {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.sign-button {
  width: 50px;
  height: 50px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: #374151;
  font-size: 21px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.sign-button.selected {
  background: var(--main);
  border-color: var(--main);
  color: #fff;
}

.sign-button:active {
  transform: scale(0.97);
}

.input-row input {
  flex: 1;
  min-width: 0;
  height: 50px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: var(--text);
  font-size: 19px;
  text-align: right;
  outline: none;
}

.input-row input:focus {
  border-color: #6b7280;
  box-shadow: 0 0 0 2px rgba(107,114,128,0.12);
}

.unit {
  width: 30px;
  font-size: 16px;
  font-weight: 700;
}

.fixed-plus {
  width: 50px;
  text-align: center;
  font-size: 21px;
  font-weight: 800;
}

.helper {
  margin-top: 6px;
  color: var(--sub);
  font-size: 12px;
  line-height: 1.5;
}

.error {
  min-height: 18px;
  margin-top: 5px;
  color: var(--error);
  font-size: 13px;
  line-height: 1.4;
}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.action-button {
  flex: 1;
  height: 54px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.calculate {
  border: none;
  background: var(--main);
  color: #fff;
}

.calculate:active {
  transform: scale(0.98);
}

.reset {
  border: 1px solid var(--border);
  background: #fff;
  color: #374151;
}

.result-card {
  display: none;
}

.result-title {
  margin: 0 0 14px;
  font-size: 19px;
  font-weight: 800;
}

.result-note {
  margin: -7px 0 14px;
  color: var(--sub);
  font-size: 12px;
}

.adjustment-result {
  margin-bottom: 16px;
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.adjustment-title {
  margin-bottom: 10px;
  font-size: 15px;
  font-weight: 800;
}

.adjustment-values {
  display: grid;
  gap: 8px;
}

.adjustment-value {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
}

.adjustment-value strong {
  font-size: 21px;
}

.result-grid {
  display: grid;
  gap: 10px;
}

.result-item {
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.result-item-name {
  margin-bottom: 5px;
  font-size: 15px;
  font-weight: 800;
}

.result-range {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.result-range .unit-text {
  font-size: 17px;
  font-weight: 700;
}

.infinity {
  font-size: 22px;
}

@media (max-width: 380px) {

  .app {
    padding: 12px 10px 30px;
  }

  .card {
    padding: 16px;
    border-radius: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .sign-button {
    width: 45px;
  }

  .fixed-plus {
    width: 45px;
  }

  .result-range {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>明視域計算ツール</h1>
  </div>


  <div class="card">

    <div class="section-title">
      基本情報
    </div>


    <!-- 完全矯正値 -->

    <div class="field">

      <div class="field-label">
        <strong>完全矯正値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="fullMinus"
          >−</button>

          <button
            type="button"
            class="sign-button"
            id="fullPlus"
          >＋</button>

        </div>

        <input
          id="full"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：500"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        0.25D刻み　例：500 → 5.00D
      </div>

      <div id="fullError" class="error"></div>

    </div>


    <!-- 装用値 -->

    <div class="field">

      <div class="field-label">
        <strong>装用値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="wearMinus"
          >−</button>

          <button
            type="button"
            class="sign-button"
            id="wearPlus"
          >＋</button>

        </div>

        <input
          id="wear"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：450"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        0.25D刻み　例：450 → 4.50D
      </div>

      <div id="wearError" class="error"></div>

    </div>


    <div class="section-title" style="margin-top:28px;">
      調節・加入
    </div>


    <!-- 装用値でぼやけた距離 -->

    <div class="field">

      <div class="field-label">
        <strong>装用値でぼやけた距離</strong>
        <span class="optional">任意</span>
      </div>

      <div class="input-row">

        <input
          id="blur"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：30"
        >

        <span class="unit">cm</span>

      </div>

      <div class="helper">
        入力すると調節力を自動計算します。
      </div>

      <div id="blurError" class="error"></div>

    </div>


    <!-- 調節力 -->

    <div class="field">

      <div class="field-label">
        <strong>調節力</strong>
        <span class="optional">任意</span>
      </div>

      <div class="input-row">

        <input
          id="accommodation"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：200"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        入力すると装用値でぼやけた距離を自動計算します。
      </div>

      <div id="accommodationError" class="error"></div>

    </div>


    <!-- 装用値加入度数 -->

    <div class="field">

      <div class="field-label">
        <strong>装用値加入度数</strong>
        <span class="optional">任意</span>
      </div>

      <div class="input-row">

        <span class="fixed-plus">＋</span>

        <input
          id="add"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：200"
        >

        <span class="unit">D</span>

      </div>

      <div class="helper">
        加入度数あり：遠用・中用・近用を表示します。
      </div>

      <div id="addError" class="error"></div>

    </div>


    <div class="button-row">

      <button
        type="button"
        class="action-button calculate"
        id="calculate"
      >
        計算する
      </button>

      <button
        type="button"
        class="action-button reset"
        id="reset"
      >
        リセット
      </button>

    </div>

  </div>


  <div
    id="result"
    class="card result-card"
  ></div>

</div>


<script>

/* =====================================
   入力欄
===================================== */

const fullInput =
  document.getElementById("full");

const wearInput =
  document.getElementById("wear");

const blurInput =
  document.getElementById("blur");

const accommodationInput =
  document.getElementById("accommodation");

const addInput =
  document.getElementById("add");

const resultBox =
  document.getElementById("result");


let fullSign = "-";
let wearSign = "-";


/* =====================================
   全角 → 半角
===================================== */

function toHalfWidth(value) {

  return value
    .replace(/[０-９．]/g, function(s) {

      return String.fromCharCode(
        s.charCodeAt(0) - 0xFEE0
      );

    })
    .replace(/＋/g, "+")
    .replace(/−/g, "-");

}


/* =====================================
   度数入力整形
===================================== */

function normalizeDegreeInput(input) {

  let value =
    toHalfWidth(input.value.trim());

  value =
    value.replace(/[^0-9.]/g, "");

  const parts =
    value.split(".");

  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts.slice(1).join("");

  }

  if (value === "") {

    input.value = "";

    return;

  }

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return;
  }

  if (
    Number.isInteger(number) &&
    number >= 25
  ) {

    input.value =
      (number / 100).toFixed(2);

    return;

  }

  input.value =
    number.toFixed(2);

}


/* =====================================
   距離入力整形
===================================== */

function normalizeDistanceInput() {

  let value =
    toHalfWidth(
      blurInput.value.trim()
    );

  value =
    value.replace(/[^0-9]/g, "");

  blurInput.value =
    value;

}


/* =====================================
   調節力入力整形
===================================== */

function normalizeAccommodationInput() {

  let value =
    toHalfWidth(
      accommodationInput.value.trim()
    );

  value =
    value.replace(/[^0-9.]/g, "");

  const parts =
    value.split(".");

  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts.slice(1).join("");

  }

  if (value === "") {

    accommodationInput.value = "";

    return;

  }

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return;
  }

  /*
    200 → 2.00D
    150 → 1.50D
    2 → 2.00D
  */

  if (
    Number.isInteger(number) &&
    number >= 25
  ) {

    accommodationInput.value =
      (number / 100).toFixed(2);

    return;

  }

  accommodationInput.value =
    number.toFixed(2);

}


/* =====================================
   符号ボタン
===================================== */

function setupSignButtons(
  minusId,
  plusId,
  callback
) {

  const minus =
    document.getElementById(minusId);

  const plus =
    document.getElementById(plusId);


  minus.addEventListener(
    "click",
    function() {

      minus.classList.add("selected");

      plus.classList.remove("selected");

      callback("-");

    }
  );


  plus.addEventListener(
    "click",
    function() {

      plus.classList.add("selected");

      minus.classList.remove("selected");

      callback("+");

    }
  );

}


setupSignButtons(
  "fullMinus",
  "fullPlus",
  function(sign) {

    fullSign = sign;

  }
);


setupSignButtons(
  "wearMinus",
  "wearPlus",
  function(sign) {

    wearSign = sign;

  }
);


/* =====================================
   エラー
===================================== */

function error(id, message) {

  document.getElementById(id).textContent =
    message;

}


/* =====================================
   遠点屈折力
===================================== */

function getFarPointPower() {

  const full =
    Number(fullInput.value);

  const wear =
    Number(wearInput.value);

  const fullPower =
    fullSign === "-"
      ? -full
      : full;

  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;

  return -fullPower + wearPower;

}


/* =====================================
   ぼやけた距離 → 調節力
===================================== */

function updateAccommodationFromDistance() {

  normalizeDistanceInput();

  if (
    blurInput.value.trim() === ""
  ) {
    return;
  }

  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {
    return;
  }

  const distanceValue =
    Number(blurInput.value);

  if (
    !Number.isFinite(distanceValue) ||
    distanceValue <= 0
  ) {
    return;
  }

  const farPointPower =
    getFarPointPower();

  const nearPointPower =
    100 / distanceValue;

  const accommodation =
    nearPointPower - farPointPower;

  accommodationInput.value =
    accommodation.toFixed(2);

}


/* =====================================
   調節力 → ぼやけた距離
===================================== */

function updateDistanceFromAccommodation() {

  normalizeAccommodationInput();

  if (
    accommodationInput.value.trim() === ""
  ) {
    return;
  }

  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {
    return;
  }

  const accommodation =
    Number(accommodationInput.value);

  if (
    !Number.isFinite(accommodation)
  ) {
    return;
  }

  const farPointPower =
    getFarPointPower();

  const nearPointPower =
    farPointPower +
    accommodation;


  if (
    nearPointPower <= 0
  ) {

    blurInput.value =
      "無限遠方";

    return;

  }


  const distance =
    100 / nearPointPower;

  blurInput.value =
    Math.round(distance);

}


/* =====================================
   フォーカスを離れた時に自動計算
===================================== */

blurInput.addEventListener(
  "blur",
  function() {

    updateAccommodationFromDistance();

  }
);


accommodationInput.addEventListener(
  "blur",
  function() {

    updateDistanceFromAccommodation();

  }
);


/* =====================================
   完全矯正値・装用値変更時
===================================== */

[
  fullInput,
  wearInput
].forEach(function(input) {

  input.addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(this);

      /*
        すでに距離が入力されている場合は
        距離を基準に調節力を再計算
      */

      if (
        blurInput.value.trim() !== "" &&
        blurInput.value !== "無限遠方"
      ) {

        updateAccommodationFromDistance();

      }
      else if (
        accommodationInput.value.trim() !== ""
      ) {

        updateDistanceFromAccommodation();

      }

    }
  );

});


/* =====================================
   加入度数など
===================================== */

[
  addInput
].forEach(function(input) {

  input.addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(this);

    }
  );

});


/* =====================================
   距離計算
===================================== */

function distance(power) {

  if (power <= 0) {

    return Infinity;

  }

  return 100 / power;

}


/* =====================================
   距離表示
===================================== */

function displayDistance(value) {

  if (!Number.isFinite(value)) {

    return '<span class="infinity">無限遠方</span>';

  }

  return (
    Math.round(value) +
    '<span class="unit-text">cm</span>'
  );

}


/* =====================================
   結果行
===================================== */

function resultRow(
  name,
  far,
  near
) {

  let text =
    displayDistance(far);

  if (near !== null) {

    text +=
      " 〜 " +
      displayDistance(near);

  }

  return `
    <div class="result-item">

      <div class="result-item-name">
        ${name}
      </div>

      <div class="result-range">
        ${text}
      </div>

    </div>
  `;

}


/* =====================================
   計算
===================================== */

document
  .getElementById("calculate")
  .addEventListener(
    "click",
    calculate
  );


function calculate() {

  normalizeDegreeInput(fullInput);

  normalizeDegreeInput(wearInput);

  if (
    blurInput.value !== "無限遠方"
  ) {
    normalizeDistanceInput();
  }

  normalizeAccommodationInput();

  normalizeDegreeInput(addInput);


  error("fullError", "");

  error("wearError", "");

  error("blurError", "");

  error("accommodationError", "");

  error("addError", "");


  resultBox.style.display =
    "none";


  /*
    必須入力
  */

  if (
    fullInput.value.trim() === ""
  ) {

    error(
      "fullError",
      "完全矯正値を入力してください。"
    );

    return;

  }


  if (
    wearInput.value.trim() === ""
  ) {

    error(
      "wearError",
      "装用値を入力してください。"
    );

    return;

  }


  const full =
    Number(fullInput.value);

  const wear =
    Number(wearInput.value);


  if (
    !Number.isFinite(full) ||
    !Number.isFinite(wear)
  ) {

    error(
      "fullError",
      "正しい度数を入力してください。"
    );

    return;

  }


  const fullPower =
    fullSign === "-"
      ? -full
      : full;

  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;


  const farPointPower =
    -fullPower +
    wearPower;


  /*
    調節力・ぼやけた距離
  */

  let accommodation =
    null;

  let blurDistanceValue =
    null;


  /*
    ぼやけた距離が入力されている場合
  */

  if (
    blurInput.value.trim() !== "" &&
    blurInput.value !== "無限遠方"
  ) {

    blurDistanceValue =
      Number(blurInput.value);

    if (
      !Number.isFinite(blurDistanceValue) ||
      blurDistanceValue <= 0
    ) {

      error(
        "blurError",
        "正しい距離を入力してください。"
      );

      return;

    }


    const nearPointPower =
      100 / blurDistanceValue;

    accommodation =
      nearPointPower -
      farPointPower;


    accommodationInput.value =
      accommodation.toFixed(2);

  }

  /*
    ぼやけた距離がなく、
    調節力が入力されている場合
  */

  else if (
    accommodationInput.value.trim() !== ""
  ) {

    accommodation =
      Number(
        accommodationInput.value
      );

    if (
      !Number.isFinite(accommodation)
    ) {

      error(
        "accommodationError",
        "正しい調節力を入力してください。"
      );

      return;

    }


    const nearPointPower =
      farPointPower +
      accommodation;


    if (
      nearPointPower <= 0
    ) {

      blurDistanceValue =
        Infinity;

      blurInput.value =
        "無限遠方";

    }
    else {

      blurDistanceValue =
        100 / nearPointPower;

      blurInput.value =
        Math.round(blurDistanceValue);

    }

  }


  /*
    遠用
  */

  const farDistance =
    distance(
      farPointPower
    );


  let nearDistance =
    null;


  if (
    accommodation !== null
  ) {

    nearDistance =
      distance(
        farPointPower +
        accommodation
      );

  }


  /*
    加入度数
  */

  let addition =
    null;


  if (
    addInput.value.trim() !== ""
  ) {

    addition =
      Number(addInput.value);

    if (
      !Number.isFinite(addition)
    ) {

      error(
        "addError",
        "正しい加入度数を入力してください。"
      );

      return;

    }

  }


  /*
    結果表示
  */

  let html = `

    <div class="result-title">
      計算結果
    </div>

  `;


  /*
    調節力・ぼやけた距離
  */

  if (
    accommodation !== null ||
    blurDistanceValue !== null
  ) {

    html += `

      <div class="adjustment-result">

        <div class="adjustment-title">
          調節・ぼやけた距離
        </div>

        <div class="adjustment-values">

          <div class="adjustment-value">
            <span>調節力</span>
            <strong>
              ${accommodation !== null
                ? accommodation.toFixed(2) + "D"
                : "—"}
            </strong>
          </div>

          <div class="adjustment-value">
            <span>装用値でぼやけた距離</span>
            <strong>
              ${
                blurDistanceValue === Infinity
                  ? "無限遠方"
                  : blurDistanceValue !== null
                    ? Math.round(blurDistanceValue) + "cm"
                    : "—"
              }
            </strong>
          </div>

        </div>

      </div>

    `;

  }


  html += `

    <div class="result-note">
      明視域：遠い距離 → 近い距離
    </div>

    <div class="result-grid">

  `;


  /*
    遠用
  */

  html +=
    resultRow(
      "遠用",
      farDistance,
      nearDistance
    );


  /*
    加入あり
  */

  if (
    addition !== null
  ) {

    /*
      中用
      加入度数の1/4
    */

    const intermediatePower =
      farPointPower +
      addition / 4;

    const intermediateFar =
      distance(
        intermediatePower
      );

    let intermediateNear =
      null;

    if (
      accommodation !== null
    ) {

      intermediateNear =
        distance(
          intermediatePower +
          accommodation
        );

    }


    html +=
      resultRow(
        "中用",
        intermediateFar,
        intermediateNear
      );


    /*
      近用
    */

    const nearPower =
      farPointPower +
      addition;

    const nearFar =
      distance(
        nearPower
      );

    let nearNear =
      null;

    if (
      accommodation !== null
    ) {

      nearNear =
        distance(
          nearPower +
          accommodation
        );

    }


    html +=
      resultRow(
        "近用",
        nearFar,
        nearNear
      );

  }


  html += `
    </div>
  `;


  resultBox.innerHTML =
    html;

  resultBox.style.display =
    "block";


  setTimeout(function() {

    resultBox.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 50);

}


/* =====================================
   リセット
===================================== */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    reset
  );


function reset() {

  fullInput.value = "";

  wearInput.value = "";

  blurInput.value = "";

  accommodationInput.value = "";

  addInput.value = "";


  fullSign = "-";

  wearSign = "-";


  document
    .getElementById("fullMinus")
    .classList.add("selected");

  document
    .getElementById("fullPlus")
    .classList.remove("selected");


  document
    .getElementById("wearMinus")
    .classList.add("selected");

  document
    .getElementById("wearPlus")
    .classList.remove("selected");


  error("fullError", "");

  error("wearError", "");

  error("blurError", "");

  error("accommodationError", "");

  error("addError", "");


  resultBox.innerHTML = "";

  resultBox.style.display = "none";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>
