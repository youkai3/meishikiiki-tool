<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明視域計算ツール</title>

<style>
:root {
  --blue: #2563eb;
  --blue-dark: #1e3a8a;
  --blue-light: #eff6ff;
  --bg: #f3f6fa;
  --card: #ffffff;
  --text: #1f2937;
  --sub: #6b7280;
  --border: #d1d5db;
  --error: #dc2626;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.app {
  width: min(720px, 94%);
  margin: 0 auto;
  padding: 22px 0 40px;
}

.header h1 {
  margin: 0 0 20px;
  text-align: center;
  font-size: 26px;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
}

.section-title {
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--blue);
  color: var(--blue-dark);
  font-size: 20px;
  font-weight: 800;
}

.field {
  margin-bottom: 22px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  margin-bottom: 8px;
  font-size: 16px;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sign-buttons {
  display: flex;
  gap: 7px;
}

.sign-button {
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--blue);
  font-size: 23px;
  font-weight: 800;
}

.sign-button.selected {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}

input {
  width: 100%;
  min-width: 0;
  height: 48px;
  padding: 0 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  font-size: 18px;
}

input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

input:disabled {
  background: #f8fafc;
  color: #64748b;
}

.unit {
  min-width: 30px;
  color: #4b5563;
  font-size: 16px;
}

.fixed-plus {
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--blue);
  color: #fff;
  font-size: 23px;
  font-weight: 800;
}

.helper {
  margin-top: 6px;
  color: var(--sub);
  font-size: 12px;
}

.error {
  margin-top: 6px;
  color: var(--error);
  font-size: 12px;
}

.mode-title {
  margin: 0 0 10px;
  font-size: 16px;
  font-weight: 800;
}

.mode-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 24px;
}

.mode-button {
  min-height: 52px;
  padding: 9px;
  border: 2px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: #374151;
  font-size: 15px;
  font-weight: 800;
}

.mode-button.selected {
  border-color: var(--blue);
  background: var(--blue-light);
  color: var(--blue);
}

.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

.badge-input {
  background: #dbeafe;
  color: #1d4ed8;
}

.badge-auto {
  background: #ecfeff;
  color: #0891b2;
}

.disabled-field {
  opacity: 0.5;
}

.button-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
  margin-top: 26px;
}

.action-button {
  min-height: 52px;
  border-radius: 11px;
  font-size: 16px;
  font-weight: 800;
}

.calculate {
  border: none;
  background: var(--blue);
  color: #fff;
}

.reset {
  border: 1px solid var(--border);
  background: #fff;
  color: #374151;
}

.result-card {
  display: none;
}

.result-title {
  margin-bottom: 14px;
  font-size: 19px;
  font-weight: 800;
}

.result-note {
  margin-bottom: 14px;
  color: var(--sub);
  font-size: 12px;
}

.adjustment-result {
  margin-bottom: 16px;
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.adjustment-title {
  margin-bottom: 10px;
  font-size: 15px;
  font-weight: 800;
}

.adjustment-values {
  display: grid;
  gap: 8px;
}

.adjustment-value {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 15px;
}

.adjustment-value strong {
  text-align: right;
  font-size: 20px;
}

.result-grid {
  display: grid;
  gap: 10px;
}

.result-item {
  padding: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #fafafa;
}

.result-item-name {
  margin-bottom: 5px;
  font-size: 15px;
  font-weight: 800;
}

.result-range {
  font-size: 24px;
  font-weight: 800;
}

.unit-text {
  font-size: 16px;
  font-weight: 700;
}

.infinity {
  font-size: 21px;
}

@media (max-width: 520px) {
  .app {
    width: 94%;
    padding-top: 16px;
  }

  .card {
    padding: 18px;
  }

  .header h1 {
    font-size: 23px;
  }

  .mode-buttons {
    grid-template-columns: 1fr;
  }

  .sign-button,
  .fixed-plus {
    width: 46px;
  }

  .result-range {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>明視域計算ツール</h1>
  </div>


  <!-- 基本 -->
  <div class="card">

    <div class="section-title">
      基本
    </div>


    <!-- 完全矯正値 -->
    <div class="field">

      <div class="field-label">
        <strong>完全矯正値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="fullMinus"
          >
            −
          </button>

          <button
            type="button"
            class="sign-button"
            id="fullPlus"
          >
            ＋
          </button>

        </div>

        <input
          id="full"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：500"
        >

        <span class="unit">
          D
        </span>

      </div>

      <div class="helper">
        0.25D刻み　例：500 → 5.00D
      </div>

      <div
        id="fullError"
        class="error"
      ></div>

    </div>


    <!-- 装用値 -->
    <div class="field">

      <div class="field-label">
        <strong>装用値</strong>
      </div>

      <div class="input-row">

        <div class="sign-buttons">

          <button
            type="button"
            class="sign-button selected"
            id="wearMinus"
          >
            −
          </button>

          <button
            type="button"
            class="sign-button"
            id="wearPlus"
          >
            ＋
          </button>

        </div>

        <input
          id="wear"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：450"
        >

        <span class="unit">
          D
        </span>

      </div>

      <div class="helper">
        0.25D刻み　例：450 → 4.50D
      </div>

      <div
        id="wearError"
        class="error"
      ></div>

    </div>

  </div>


  <!-- 調節 -->
  <div class="card">

    <div class="section-title">
      調節
    </div>


    <div class="mode-title">
      どちらから計算しますか？
    </div>


    <div class="mode-buttons">

      <button
        type="button"
        class="mode-button selected"
        id="accommodationMode"
      >
        調節力から計算
      </button>

      <button
        type="button"
        class="mode-button"
        id="distanceMode"
      >
        ぼやけた距離から計算
      </button>

    </div>


    <!-- 調節力 -->
    <div
      class="field"
      id="accommodationField"
    >

      <div class="field-label">

        <strong>
          調節力
        </strong>

        <span
          class="badge badge-input"
          id="accommodationBadge"
        >
          入力
        </span>

      </div>


      <div class="input-row">

        <input
          id="accommodation"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：200"
        >

        <span class="unit">
          D
        </span>

      </div>


      <div class="helper">
        例：200 → 2.00D
      </div>


      <div
        id="accommodationError"
        class="error"
      ></div>

    </div>


    <!-- 装用値でぼやけた距離 -->
    <div
      class="field disabled-field"
      id="blurField"
    >

      <div class="field-label">

        <strong>
          装用値でぼやけた距離
        </strong>

        <span
          class="badge badge-auto"
          id="blurBadge"
        >
          自動計算
        </span>

      </div>


      <div class="input-row">

        <input
          id="blur"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：30"
          disabled
        >

        <span class="unit">
          cm
        </span>

      </div>


      <div
        id="blurError"
        class="error"
      ></div>

    </div>

  </div>


  <!-- 加入 -->
  <div class="card">

    <div class="section-title">
      加入
    </div>


    <div class="field">

      <div class="field-label">

        <strong>
          装用値加入度数
        </strong>

      </div>


      <div class="input-row">

        <span class="fixed-plus">
          ＋
        </span>

        <input
          id="add"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="例：150"
        >

        <span class="unit">
          D
        </span>

      </div>


      <div class="helper">
        0.25D刻み　例：150 → 1.50D
      </div>


      <div
        id="addError"
        class="error"
      ></div>

    </div>


    <div class="button-row">

      <button
        type="button"
        class="action-button calculate"
        id="calculate"
      >
        計算する
      </button>

      <button
        type="button"
        class="action-button reset"
        id="reset"
      >
        リセット
      </button>

    </div>

  </div>


  <!-- 計算結果 -->
  <div
    id="result"
    class="card result-card"
  ></div>

</div>


<script>

const fullInput =
  document.getElementById("full");

const wearInput =
  document.getElementById("wear");

const accommodationInput =
  document.getElementById("accommodation");

const blurInput =
  document.getElementById("blur");

const addInput =
  document.getElementById("add");

const resultBox =
  document.getElementById("result");


let fullSign = "-";
let wearSign = "-";
let calculationMode = "accommodation";


/* =====================================
   全角 → 半角
===================================== */

function toHalfWidth(value) {

  return value
    .replace(
      /[０-９．]/g,
      function(s) {

        return String.fromCharCode(
          s.charCodeAt(0) - 0xFEE0
        );
      }
    )
    .replace(/＋/g, "+")
    .replace(/[−ー]/g, "-");
}


/* =====================================
   度数整形
===================================== */

function normalizeDegreeInput(input) {

  let value =
    toHalfWidth(
      input.value.trim()
    );


  value =
    value.replace(
      /[^0-9.]/g,
      ""
    );


  const parts =
    value.split(".");


  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts
        .slice(1)
        .join("");
  }


  if (value === "") {

    input.value = "";

    return;
  }


  const number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {
    return;
  }


  /*
    500 → 5.00
    450 → 4.50
    200 → 2.00
    1.5 → 1.50
  */

  if (
    !value.includes(".") &&
    Number.isInteger(number) &&
    number >= 25
  ) {

    input.value =
      (number / 100)
        .toFixed(2);

    return;
  }


  input.value =
    number.toFixed(2);
}


/* =====================================
   距離整形
===================================== */

function normalizeDistanceInput() {

  let value =
    toHalfWidth(
      blurInput.value.trim()
    );


  value =
    value.replace(
      /[^0-9]/g,
      ""
    );


  blurInput.value =
    value;
}


/* =====================================
   符号ボタン
===================================== */

function setupSignButtons(
  minusId,
  plusId,
  callback
) {

  const minus =
    document.getElementById(
      minusId
    );


  const plus =
    document.getElementById(
      plusId
    );


  minus.addEventListener(
    "click",
    function() {

      minus
        .classList
        .add("selected");


      plus
        .classList
        .remove("selected");


      callback("-");
    }
  );


  plus.addEventListener(
    "click",
    function() {

      plus
        .classList
        .add("selected");


      minus
        .classList
        .remove("selected");


      callback("+");
    }
  );
}


setupSignButtons(
  "fullMinus",
  "fullPlus",
  function(sign) {

    fullSign = sign;
  }
);


setupSignButtons(
  "wearMinus",
  "wearPlus",
  function(sign) {

    wearSign = sign;
  }
);


/* =====================================
   入力モード
===================================== */

const accommodationMode =
  document.getElementById(
    "accommodationMode"
  );


const distanceMode =
  document.getElementById(
    "distanceMode"
  );


const accommodationField =
  document.getElementById(
    "accommodationField"
  );


const blurField =
  document.getElementById(
    "blurField"
  );


const accommodationBadge =
  document.getElementById(
    "accommodationBadge"
  );


const blurBadge =
  document.getElementById(
    "blurBadge"
  );


function setCalculationMode(mode) {

  calculationMode =
    mode;


  if (
    mode === "accommodation"
  ) {

    accommodationMode
      .classList
      .add("selected");


    distanceMode
      .classList
      .remove("selected");


    accommodationInput.disabled =
      false;


    blurInput.disabled =
      true;


    accommodationField
      .classList
      .remove(
        "disabled-field"
      );


    blurField
      .classList
      .add(
        "disabled-field"
      );


    accommodationBadge.textContent =
      "入力";


    accommodationBadge.className =
      "badge badge-input";


    blurBadge.textContent =
      "自動計算";


    blurBadge.className =
      "badge badge-auto";

  }

  else {

    distanceMode
      .classList
      .add("selected");


    accommodationMode
      .classList
      .remove("selected");


    blurInput.disabled =
      false;


    accommodationInput.disabled =
      true;


    blurField
      .classList
      .remove(
        "disabled-field"
      );


    accommodationField
      .classList
      .add(
        "disabled-field"
      );


    blurBadge.textContent =
      "入力";


    blurBadge.className =
      "badge badge-input";


    accommodationBadge.textContent =
      "自動計算";


    accommodationBadge.className =
      "badge badge-auto";
  }
}


accommodationMode
  .addEventListener(
    "click",
    function() {

      setCalculationMode(
        "accommodation"
      );


      if (
        accommodationInput
          .value
          .trim() !== ""
      ) {

        updateDistanceFromAccommodation();
      }
    }
  );


distanceMode
  .addEventListener(
    "click",
    function() {

      setCalculationMode(
        "distance"
      );


      if (
        blurInput
          .value
          .trim() !== ""
      ) {

        updateAccommodationFromDistance();
      }
    }
  );


/* =====================================
   エラー
===================================== */

function error(
  id,
  message
) {

  document
    .getElementById(id)
    .textContent =
      message;
}


/* =====================================
   遠点屈折力
===================================== */

function getFarPointPower() {

  const full =
    Number(
      fullInput.value
    );


  const wear =
    Number(
      wearInput.value
    );


  const fullPower =
    fullSign === "-"
      ? -full
      : full;


  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;


  return (
    -fullPower +
    wearPower
  );
}


/* =====================================
   調節力 → 装用値でぼやけた距離
===================================== */

function updateDistanceFromAccommodation() {

  normalizeDegreeInput(
    accommodationInput
  );


  if (
    accommodationInput
      .value
      .trim() === ""
  ) {

    blurInput.value = "";

    return;
  }


  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {
    return;
  }


  const accommodation =
    Number(
      accommodationInput.value
    );


  if (
    !Number.isFinite(
      accommodation
    )
  ) {
    return;
  }


  const farPointPower =
    getFarPointPower();


  const nearPointPower =
    farPointPower +
    accommodation;


  if (
    nearPointPower <= 0
  ) {

    blurInput.value =
      "無限遠方";

    return;
  }


  const distance =
    100 /
    nearPointPower;


  blurInput.value =
    Math.round(
      distance
    );
}


/* =====================================
   装用値でぼやけた距離 → 調節力
===================================== */

function updateAccommodationFromDistance() {

  normalizeDistanceInput();


  if (
    blurInput
      .value
      .trim() === ""
  ) {

    accommodationInput.value =
      "";

    return;
  }


  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {
    return;
  }


  const distanceValue =
    Number(
      blurInput.value
    );


  if (
    !Number.isFinite(
      distanceValue
    ) ||
    distanceValue <= 0
  ) {
    return;
  }


  const farPointPower =
    getFarPointPower();


  const nearPointPower =
    100 /
    distanceValue;


  const accommodation =
    nearPointPower -
    farPointPower;


  accommodationInput.value =
    accommodation
      .toFixed(2);
}


/* =====================================
   入力後の整形
===================================== */

fullInput
  .addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(
        fullInput
      );

      updateSelectedAutoValue();
    }
  );


wearInput
  .addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(
        wearInput
      );

      updateSelectedAutoValue();
    }
  );


accommodationInput
  .addEventListener(
    "blur",
    function() {

      if (
        calculationMode !==
        "accommodation"
      ) {
        return;
      }


      updateDistanceFromAccommodation();
    }
  );


blurInput
  .addEventListener(
    "blur",
    function() {

      if (
        calculationMode !==
        "distance"
      ) {
        return;
      }


      updateAccommodationFromDistance();
    }
  );


addInput
  .addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(
        addInput
      );
    }
  );


function updateSelectedAutoValue() {

  if (
    fullInput.value.trim() === "" ||
    wearInput.value.trim() === ""
  ) {
    return;
  }


  if (
    calculationMode ===
    "accommodation"
  ) {

    if (
      accommodationInput
        .value
        .trim() !== ""
    ) {

      updateDistanceFromAccommodation();
    }

  }

  else {

    if (
      blurInput
        .value
        .trim() !== ""
    ) {

      updateAccommodationFromDistance();
    }
  }
}


/* =====================================
   距離計算
===================================== */

function distance(power) {

  if (
    power <= 0
  ) {

    return Infinity;
  }


  return (
    100 /
    power
  );
}


/* =====================================
   距離表示
===================================== */

function displayDistance(value) {

  if (
    !Number.isFinite(value)
  ) {

    return (
      '<span class="infinity">' +
      '無限遠方' +
      '</span>'
    );
  }


  return (
    Math.round(value) +
    '<span class="unit-text">' +
    'cm' +
    '</span>'
  );
}


/* =====================================
   結果行
===================================== */

function resultRow(
  name,
  far,
  near
) {

  let text =
    displayDistance(
      far
    );


  if (
    near !== null
  ) {

    text +=
      " 〜 " +
      displayDistance(
        near
      );
  }


  return `
    <div class="result-item">

      <div class="result-item-name">
        ${name}
      </div>

      <div class="result-range">
        ${text}
      </div>

    </div>
  `;
}


/* =====================================
   計算
===================================== */

document
  .getElementById(
    "calculate"
  )
  .addEventListener(
    "click",
    calculate
  );


function calculate() {

  normalizeDegreeInput(
    fullInput
  );


  normalizeDegreeInput(
    wearInput
  );


  normalizeDegreeInput(
    addInput
  );


  if (
    calculationMode ===
    "accommodation"
  ) {

    normalizeDegreeInput(
      accommodationInput
    );


    updateDistanceFromAccommodation();

  }

  else {

    normalizeDistanceInput();


    updateAccommodationFromDistance();
  }


  error(
    "fullError",
    ""
  );


  error(
    "wearError",
    ""
  );


  error(
    "blurError",
    ""
  );


  error(
    "accommodationError",
    ""
  );


  error(
    "addError",
    ""
  );


  resultBox.style.display =
    "none";


  /* 必須入力 */

  if (
    fullInput.value.trim() === ""
  ) {

    error(
      "fullError",
      "完全矯正値を入力してください。"
    );

    return;
  }


  if (
    wearInput.value.trim() === ""
  ) {

    error(
      "wearError",
      "装用値を入力してください。"
    );

    return;
  }


  const full =
    Number(
      fullInput.value
    );


  const wear =
    Number(
      wearInput.value
    );


  if (
    !Number.isFinite(full) ||
    !Number.isFinite(wear)
  ) {

    error(
      "fullError",
      "正しい度数を入力してください。"
    );

    return;
  }


  const fullPower =
    fullSign === "-"
      ? -full
      : full;


  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;


  const farPointPower =
    -fullPower +
    wearPower;


  let accommodation =
    null;


  let blurDistanceValue =
    null;


  /* ぼやけた距離から */

  if (
    calculationMode ===
    "distance"
  ) {

    if (
      blurInput
        .value
        .trim() !== ""
    ) {

      blurDistanceValue =
        Number(
          blurInput.value
        );


      if (
        !Number.isFinite(
          blurDistanceValue
        ) ||
        blurDistanceValue <= 0
      ) {

        error(
          "blurError",
          "正しい距離を入力してください。"
        );

        return;
      }


      const nearPointPower =
        100 /
        blurDistanceValue;


      accommodation =
        nearPointPower -
        farPointPower;


      accommodationInput.value =
        accommodation
          .toFixed(2);
    }
  }


  /* 調節力から */

  else {

    if (
      accommodationInput
        .value
        .trim() !== ""
    ) {

      accommodation =
        Number(
          accommodationInput.value
        );


      if (
        !Number.isFinite(
          accommodation
        )
      ) {

        error(
          "accommodationError",
          "正しい調節力を入力してください。"
        );

        return;
      }


      const nearPointPower =
        farPointPower +
        accommodation;


      if (
        nearPointPower <= 0
      ) {

        blurDistanceValue =
          Infinity;


        blurInput.value =
          "無限遠方";
      }

      else {

        blurDistanceValue =
          100 /
          nearPointPower;


        blurInput.value =
          Math.round(
            blurDistanceValue
          );
      }
    }
  }


  /* 遠用 */

  const farDistance =
    distance(
      farPointPower
    );


  let nearDistance =
    null;


  if (
    accommodation !== null
  ) {

    nearDistance =
      distance(
        farPointPower +
        accommodation
      );
  }


  /* 加入 */

  let addition =
    null;


  if (
    addInput
      .value
      .trim() !== ""
  ) {

    addition =
      Number(
        addInput.value
      );


    if (
      !Number.isFinite(
        addition
      )
    ) {

      error(
        "addError",
        "正しい加入度数を入力してください。"
      );

      return;
    }
  }


  /* 結果 */

  let html = `
    <div class="result-title">
      計算結果
    </div>
  `;


  if (
    accommodation !== null ||
    blurDistanceValue !== null
  ) {

    html += `
      <div class="adjustment-result">

        <div class="adjustment-title">
          調節
        </div>

        <div class="adjustment-values">

          <div class="adjustment-value">

            <span>
              調節力
            </span>

            <strong>
              ${
                accommodation !== null
                  ? accommodation.toFixed(2) + "D"
                  : "—"
              }
            </strong>

          </div>


          <div class="adjustment-value">

            <span>
              装用値でぼやけた距離
            </span>

            <strong>
              ${
                blurDistanceValue === Infinity
                  ? "無限遠方"
                  : blurDistanceValue !== null
                    ? Math.round(
                        blurDistanceValue
                      ) + "cm"
                    : "—"
              }
            </strong>

          </div>

        </div>

      </div>
    `;
  }


  html += `
    <div class="result-note">
      明視域：遠い距離 → 近い距離
    </div>

    <div class="result-grid">
  `;


  /* 遠用 */

  html +=
    resultRow(
      "遠用",
      farDistance,
      nearDistance
    );


  /* 加入あり */

  if (
    addition !== null
  ) {

    /*
      中用
      加入度数の1/4
    */

    const intermediatePower =
      farPointPower +
      addition / 4;


    const intermediateFar =
      distance(
        intermediatePower
      );


    let intermediateNear =
      null;


    if (
      accommodation !== null
    ) {

      intermediateNear =
        distance(
          intermediatePower +
          accommodation
        );
    }


    html +=
      resultRow(
        "中用",
        intermediateFar,
        intermediateNear
      );


    /*
      近用
    */

    const nearPower =
      farPointPower +
      addition;


    const nearFar =
      distance(
        nearPower
      );


    let nearNear =
      null;


    if (
      accommodation !== null
    ) {

      nearNear =
        distance(
          nearPower +
          accommodation
        );
    }


    html +=
      resultRow(
        "近用",
        nearFar,
        nearNear
      );
  }


  html += `
    </div>
  `;


  resultBox.innerHTML =
    html;


  resultBox.style.display =
    "block";
}


/* =====================================
   リセット
===================================== */

document
  .getElementById(
    "reset"
  )
  .addEventListener(
    "click",
    function() {

      fullInput.value =
        "";


      wearInput.value =
        "";


      accommodationInput.value =
        "";


      blurInput.value =
        "";


      addInput.value =
        "";


      fullSign =
        "-";


      wearSign =
        "-";


      document
        .getElementById(
          "fullMinus"
        )
        .classList
        .add("selected");


      document
        .getElementById(
          "fullPlus"
        )
        .classList
        .remove("selected");


      document
        .getElementById(
          "wearMinus"
        )
        .classList
        .add("selected");


      document
        .getElementById(
          "wearPlus"
        )
        .classList
        .remove("selected");


      error(
        "fullError",
        ""
      );


      error(
        "wearError",
        ""
      );


      error(
        "blurError",
        ""
      );


      error(
        "accommodationError",
        ""
      );


      error(
        "addError",
        ""
      );


      resultBox.innerHTML =
        "";


      resultBox.style.display =
        "none";


      setCalculationMode(
        "accommodation"
      );
    }
  );


/* =====================================
   初期状態
===================================== */

setCalculationMode(
  "accommodation"
);

</script>

</body>
</html>
