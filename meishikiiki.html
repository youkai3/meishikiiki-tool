<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>明視域計算ツール</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6f8;
  color: #1f2937;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

.card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 4px 0 24px;
}

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
}

.field small {
  color: #6b7280;
  font-weight: 400;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sign-buttons {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

.sign-button {
  width: 48px;
  height: 48px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: #ffffff;
  color: #374151;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

.sign-button.selected {
  background: #111827;
  color: #ffffff;
  border-color: #111827;
}

.input-row input {
  flex: 1;
  min-width: 0;
  height: 48px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  padding: 0 14px;
  font-size: 18px;
  outline: none;
}

.input-row input:focus {
  border-color: #64748b;
}

.input-row span,
.input-row strong {
  font-size: 17px;
  white-space: nowrap;
}

.error {
  min-height: 18px;
  margin-top: 5px;
  color: #b91c1c;
  font-size: 13px;
}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

#calculate,
#reset {
  flex: 1;
  height: 52px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

#calculate {
  border: none;
  background: #111827;
  color: #ffffff;
}

#reset {
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #374151;
}

.result h2 {
  margin: 0 0 4px;
  font-size: 20px;
}

.result-section {
  padding: 16px 0;
  border-top: 1px solid #e5e7eb;
}

.result-section:first-of-type {
  border-top: none;
}

.result-name {
  font-size: 17px;
  font-weight: 700;
}

.result-range {
  margin-top: 5px;
  font-size: 28px;
  font-weight: 700;
}

@media (max-width: 400px) {

  .app {
    padding: 12px 10px 30px;
  }

  .card {
    padding: 16px;
  }

  h1 {
    font-size: 22px;
  }

  .sign-button {
    width: 44px;
  }

  .result-range {
    font-size: 25px;
  }

}

</style>

</head>

<body>

<div class="app">

  <div class="card">

```
<h1>明視域計算ツール</h1>


<!-- 完全矯正値 -->

<div class="field">

  <label>完全矯正値</label>

  <div class="input-row">

    <div class="sign-buttons">

      <button
        type="button"
        class="sign-button selected"
        id="fullMinus"
      >−</button>

      <button
        type="button"
        class="sign-button"
        id="fullPlus"
      >＋</button>

    </div>

    <input
      id="full"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="例：5.00"
    >

    <span>D</span>

  </div>

  <div id="fullError" class="error"></div>

</div>


<!-- 装用値 -->

<div class="field">

  <label>装用値</label>

  <div class="input-row">

    <div class="sign-buttons">

      <button
        type="button"
        class="sign-button selected"
        id="wearMinus"
      >−</button>

      <button
        type="button"
        class="sign-button"
        id="wearPlus"
      >＋</button>

    </div>

    <input
      id="wear"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="例：4.50"
    >

    <span>D</span>

  </div>

  <div id="wearError" class="error"></div>

</div>


<!-- ぼやけた距離 -->

<div class="field">

  <label>
    ぼやけた距離
    <small>（任意）</small>
  </label>

  <div class="input-row">

    <input
      id="blur"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="10〜100"
    >

    <span>cm</span>

  </div>

  <div id="blurError" class="error"></div>

</div>


<!-- 加入度数 -->

<div class="field">

  <label>
    加入度数
    <small>（任意）</small>
  </label>

  <div class="input-row">

    <strong>＋</strong>

    <input
      id="add"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="例：2.00"
    >

    <span>D</span>

  </div>

  <div id="addError" class="error"></div>

</div>


<!-- ボタン -->

<div class="button-row">

  <button
    type="button"
    id="calculate"
  >
    計算
  </button>

  <button
    type="button"
    id="reset"
  >
    リセット
  </button>

</div>
```

  </div>

  <!-- 計算結果 -->

  <div
    id="result"
    class="card result"
    style="display:none;"
  ></div>

</div>

<script>


// =====================================
// 入力欄
// =====================================

const fullInput =
  document.getElementById("full");

const wearInput =
  document.getElementById("wear");

const blurInput =
  document.getElementById("blur");

const addInput =
  document.getElementById("add");

const resultBox =
  document.getElementById("result");


// =====================================
// 符号
// =====================================

let fullSign = "-";
let wearSign = "-";


// =====================================
// 全角 → 半角
// =====================================

function toHalfWidth(value) {

  return value
    .replace(/[０-９．]/g, function(s) {

      return String.fromCharCode(
        s.charCodeAt(0) - 0xFEE0
      );

    })
    .replace(/＋/g, "+")
    .replace(/−/g, "-");

}


// =====================================
// 度数入力の整形
// =====================================

function normalizeDegreeInput(input) {

  let value =
    input.value.trim();


  // 全角 → 半角

  value =
    toHalfWidth(value);


  // 数字・小数点以外を削除

  value =
    value.replace(
      /[^0-9.]/g,
      ""
    );


  // 小数点を1個にする

  const parts =
    value.split(".");


  if (parts.length > 2) {

    value =
      parts[0] +
      "." +
      parts.slice(1).join("");

  }


  if (value === "") {

    input.value = "";

    return;

  }


  const number =
    Number(value);


  if (!Number.isFinite(number)) {

    return;

  }


  /*
    500 → 5.00
    450 → 4.50
    425 → 4.25
    200 → 2.00
  */

  if (
    Number.isInteger(number) &&
    number >= 25
  ) {

    input.value =
      (number / 100).toFixed(2);

    return;

  }


  /*
    5 → 5.00
    4.5 → 4.50
    4.25 → 4.25
  */

  input.value =
    number.toFixed(2);

}


// =====================================
// 距離入力の整形
// =====================================

function normalizeBlurInput() {

  let value =
    blurInput.value.trim();


  value =
    toHalfWidth(value);


  value =
    value.replace(
      /[^0-9]/g,
      ""
    );


  blurInput.value =
    value;

}


// =====================================
// 入力欄から離れた時に整形
// =====================================

[
  fullInput,
  wearInput,
  addInput
]
.forEach(function(input) {

  input.addEventListener(
    "blur",
    function() {

      normalizeDegreeInput(this);

    }
  );

});


blurInput.addEventListener(
  "blur",
  function() {

    normalizeBlurInput();

  }
);


// =====================================
// 符号ボタン
// =====================================

function setupSignButtons(
  minusId,
  plusId,
  callback
) {

  const minus =
    document.getElementById(minusId);

  const plus =
    document.getElementById(plusId);


  minus.addEventListener(
    "click",
    function() {

      minus.classList.add("selected");

      plus.classList.remove("selected");

      callback("-");

    }
  );


  plus.addEventListener(
    "click",
    function() {

      plus.classList.add("selected");

      minus.classList.remove("selected");

      callback("+");

    }
  );

}


setupSignButtons(
  "fullMinus",
  "fullPlus",
  function(sign) {

    fullSign = sign;

  }
);


setupSignButtons(
  "wearMinus",
  "wearPlus",
  function(sign) {

    wearSign = sign;

  }
);


// =====================================
// エラー表示
// =====================================

function error(id, message) {

  document.getElementById(id).textContent =
    message;

}


// =====================================
// 度数チェック
// =====================================

function validateDegree(
  input,
  errorId,
  label
) {

  const raw =
    input.value.trim();


  if (raw === "") {

    error(
      errorId,
      label + "を入力してください。"
    );

    return false;

  }


  const value =
    Number(raw);


  if (!Number.isFinite(value)) {

    error(
      errorId,
      "正しい度数を入力してください。"
    );

    return false;

  }


  // 0.25D刻み

  const remainder =
    Math.round(value * 100) % 25;


  if (remainder !== 0) {

    error(
      errorId,
      "0.25D刻みで入力してください。"
    );

    return false;

  }


  if (
    value < 0 ||
    value > 20
  ) {

    error(
      errorId,
      "0.00〜20.00Dの範囲で入力してください。"
    );

    return false;

  }


  error(
    errorId,
    ""
  );


  return true;

}


// =====================================
// 距離計算
// =====================================

function distance(power) {

  /*
    目の要素が0以下
    → 無限遠方
  */

  if (power <= 0) {

    return Infinity;

  }


  return 100 / power;

}


// =====================================
// 距離表示
// =====================================

function displayDistance(value) {

  if (!Number.isFinite(value)) {

    return "無限遠方";

  }


  return (
    Math.round(value) +
    "cm"
  );

}


// =====================================
// 結果1行
// =====================================

function resultRow(
  name,
  far,
  near
) {

  let text =
    displayDistance(far);


  if (near !== null) {

    text +=
      " 〜 " +
      displayDistance(near);

  }


  return `

    <div class="result-section">

      <div class="result-name">
        ${name}
      </div>

      <div class="result-range">
        ${text}
      </div>

    </div>

  `;

}


// =====================================
// 計算
// =====================================

document
  .getElementById("calculate")
  .addEventListener(
    "click",
    calculate
  );


function calculate() {


  // ------------------------------
  // 全角 → 半角
  // ------------------------------

  normalizeDegreeInput(fullInput);

  normalizeDegreeInput(wearInput);

  normalizeDegreeInput(addInput);

  normalizeBlurInput();


  // ------------------------------
  // エラーを消す
  // ------------------------------

  error(
    "fullError",
    ""
  );

  error(
    "wearError",
    ""
  );

  error(
    "blurError",
    ""
  );

  error(
    "addError",
    "");


  resultBox.style.display =
    "none";


  // ------------------------------
  // 完全矯正値
  // ------------------------------

  const fullValid =
    validateDegree(
      fullInput,
      "fullError",
      "完全矯正値"
    );


  // ------------------------------
  // 装用値
  // ------------------------------

  const wearValid =
    validateDegree(
      wearInput,
      "wearError",
      "装用値"
    );


  if (
    !fullValid ||
    !wearValid
  ) {

    return;

  }


  // ------------------------------
  // ぼやけた距離
  // ------------------------------

  let blurDistanceValue =
    null;


  if (
    blurInput.value.trim() !== ""
  ) {

    const value =
      Number(
        blurInput.value
      );


    if (
      !Number.isInteger(value) ||
      value < 10 ||
      value > 100
    ) {

      error(
        "blurError",
        "10〜100cmの整数で入力してください。"
      );

      return;

    }


    blurDistanceValue =
      value;

  }


  // ------------------------------
  // 加入度数
  // ------------------------------

  let addition =
    null;


  if (
    addInput.value.trim() !== ""
  ) {


    const addValid =
      validateDegree(
        addInput,
        "addError",
        "加入度数"
      );


    if (!addValid) {

      return;

    }


    addition =
      Number(
        addInput.value
      );

  }


  // ------------------------------
  // D値
  // ------------------------------

  const full =
    Number(
      fullInput.value
    );


  const wear =
    Number(
      wearInput.value
    );


  const fullPower =
    fullSign === "-"
      ? -full
      : full;


  const wearPower =
    wearSign === "-"
      ? -wear
      : wear;


  // ------------------------------
  // 遠点屈折力
  // ------------------------------

  const farPointPower =
    -fullPower +
    wearPower;


  // ------------------------------
  // 調節力
  // ------------------------------

  let accommodation =
    null;


  if (
    blurDistanceValue !== null
  ) {

    const nearPointPower =
      100 /
      blurDistanceValue;


    accommodation =
      nearPointPower -
      farPointPower;

  }


  // ------------------------------
  // 遠用
  // ------------------------------

  const farDistance =
    distance(
      farPointPower
    );


  let nearDistance =
    null;


  if (
    accommodation !== null
  ) {

    nearDistance =
      distance(
        farPointPower +
        accommodation
      );

  }


  // ------------------------------
  // 結果
  // ------------------------------

  let html =
    "<h2>計算結果</h2>";


  html +=
    resultRow(
      "遠用",
      farDistance,
      nearDistance
    );


  // ------------------------------
  // 加入あり
  // ------------------------------

  if (
    addition !== null
  ) {


    // 中用
    // 加入度数の1/4

    const intermediatePower =
      farPointPower +
      addition / 4;


    const intermediateFar =
      distance(
        intermediatePower
      );


    let intermediateNear =
      null;


    if (
      accommodation !== null
    ) {

      intermediateNear =
        distance(
          intermediatePower +
          accommodation
        );

    }


    html +=
      resultRow(
        "中用",
        intermediateFar,
        intermediateNear
      );


    // 近用

    const nearPower =
      farPointPower +
      addition;


    const nearFar =
      distance(
        nearPower
      );


    let nearNear =
      null;


    if (
      accommodation !== null
    ) {

      nearNear =
        distance(
          nearPower +
          accommodation
        );

    }


    html +=
      resultRow(
        "近用",
        nearFar,
        nearNear
      );

  }


  // ------------------------------
  // 表示
  // ------------------------------

  resultBox.innerHTML =
    html;


  resultBox.style.display =
    "block";

}


// =====================================
// リセット
// =====================================

document
  .getElementById("reset")
  .addEventListener(
    "click",
    reset
  );


function reset() {


  // 入力を空欄

  fullInput.value = "";

  wearInput.value = "";

  blurInput.value = "";

  addInput.value = "";


  // 符号を−に戻す

  fullSign = "-";

  wearSign = "-";


  document
    .getElementById("fullMinus")
    .classList.add("selected");


  document
    .getElementById("fullPlus")
    .classList.remove("selected");


  document
    .getElementById("wearMinus")
    .classList.add("selected");


  document
    .getElementById("wearPlus")
    .classList.remove("selected");


  // エラーを消す

  error(
    "fullError",
    ""
  );

  error(
    "wearError",
    ""
  );

  error(
    "blurError",
    ""
  );

  error(
    "addError",
    "");


  // 結果を消す

  resultBox.innerHTML =
    "";

  resultBox.style.display =
    "none";

}

</script>

</body>
</html>
